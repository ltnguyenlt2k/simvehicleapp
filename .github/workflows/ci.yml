# Shared CI (M00-T08): compose lint, contract-only-deps, license scan + module checks.
# Rules: AGENTS §2, ADR-0004, ADR-0005, ADR-0009. Actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-selftest:
    name: CI checks reject violations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts/ci/tests -v

  compose-lint:
    name: compose lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose version
      - run: python3 scripts/ci/compose_lint.py

  contract-only-deps:
    name: contract-only-deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/ci/contract_only_deps.py
      - name: Studio BlockSpec snapshot matches core (block-parity input, ADR-0011)
        run: python3 scripts/ci/block_specs_sync.py
      - name: Studio golden copy matches contracts (graph-adapter golden test input, M04-T01)
        run: python3 scripts/ci/golden_sync.py

  vendored-trees:
    name: vendored trees match upstream pins
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sim v0.7.13 (declared changes only, UPSTREAM_SYNC.allow)
        run: >-
          python3 scripts/upstream_tree_check.py --repo simstudioai/sim
          --commit ad0b8678b5dc4b6d5703481d567f29c9facc6f67 --path modules/simvehicleapp-studio
          --allow modules/simvehicleapp-studio/UPSTREAM_SYNC.allow
      - name: Velocitas C++ template (unmodified)
        run: >-
          python3 scripts/upstream_tree_check.py --repo eclipse-velocitas/vehicle-app-cpp-template
          --commit 275e858e3de8f43d6b4c71a389e358dffe73b42b --path modules/velocitas-stack/templates/vehicle-app-cpp-template
      - name: Velocitas Python template (unmodified)
        run: >-
          python3 scripts/upstream_tree_check.py --repo eclipse-velocitas/vehicle-app-python-template
          --commit e7082f75d1831489462f6672b6858f7ea7708256 --path modules/velocitas-stack/templates/vehicle-app-python-template

  studio-guards:
    name: studio license guards (no apps/sim/ee, no @/ee/, no Scratch opcodes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/ci/studio_guards.py
      - name: Scratch opcode denylist (ADR-0004 clean-room)
        run: python3 scripts/ci/scratch_denylist.py

  studio:
    name: simvehicleapp-studio type-check + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/simvehicleapp-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13 # packageManager of the Sim snapshot
      - run: bun install --frozen-lockfile
      - name: API contract audit (Sim boundary rules)
        run: bun run check:api-validation:strict
      - name: Type-check apps/sim
        working-directory: modules/simvehicleapp-studio/apps/sim
        run: bun run type-check
      - name: Unit tests apps/sim
        working-directory: modules/simvehicleapp-studio/apps/sim
        run: bun run test

  studio-image:
    name: studio image builds from source + E2E
    runs-on: ubuntu-24.04
    env:
      # Studio + core fragments share the sv-internal network, as in the root compose.
      STACK: docker compose -f modules/simvehicleapp-studio/compose.simvehicleapp.yaml -f modules/simvehicleapp-core/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Upstream Sim builds this image on 8-vCPU/32 GB runners; the standard runner has 16 GB,
      # so `next build` page generation gets killed (exit 143) without extra swap.
      - name: Add 16 GB swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/sv-swapfile
          sudo chmod 600 /mnt/sv-swapfile
          sudo mkswap /mnt/sv-swapfile
          sudo swapon /mnt/sv-swapfile
          free -h
          df -h / /mnt
      - name: docker build (app.Dockerfile, not pushed)
        run: >-
          docker build --file modules/simvehicleapp-studio/docker/app.Dockerfile
          --tag simvehicleapp/studio:dev modules/simvehicleapp-studio
      - name: Studio image size (docs/STUDIO_BUILD.md)
        run: docker image ls simvehicleapp/studio:dev --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Export image for local verification (main only, 3 days; before E2E so a failing gate can still be previewed and debugged locally)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save simvehicleapp/studio:dev | gzip -1 > studio-image.tar.gz && ls -lh studio-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-image
          path: studio-image.tar.gz
          retention-days: 3
          compression-level: 0
      - name: Build migrations and realtime images from source
        run: docker compose -f modules/simvehicleapp-studio/compose.simvehicleapp.yaml --env-file scripts/ci/ci.env build studio-migrations studio-realtime
      - name: Build contracts + core images (vss-catalog, compiler behind the studio BFF)
        run: |
          docker compose -f modules/simvehicleapp-contracts/compose.yaml build contracts
          docker compose -f modules/simvehicleapp-core/compose.yaml --env-file scripts/ci/ci.env build vss-catalog compiler
      - name: Start the studio stack (fresh random secrets)
        run: |
          {
            for k in BETTER_AUTH_SECRET ENCRYPTION_KEY API_ENCRYPTION_KEY INTERNAL_API_SECRET; do echo "$k=$(openssl rand -hex 32)"; done
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SV_STUDIO_URL=http://localhost:3000"
          } > "$RUNNER_TEMP/studio.env"
          $STACK --env-file "$RUNNER_TEMP/studio.env" \
            up -d --no-build --wait --wait-timeout 240 studio-db studio-migrations studio-realtime studio vss-catalog compiler
      - name: E2E — M1/M2/M3 acceptance gates incl. 7 goldens built on the canvas (Playwright 1.63.0)
        run: |
          docker run --rm --network host -e CI=1 -e SV_STUDIO_URL=http://localhost:3000 \
            -e SV_REPO=/repo -e SV_GOLDEN_EXPORT=1 -v "$PWD":/repo -w /repo/modules/simvehicleapp-studio/e2e \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -c "npm install --no-audit --no-fund --silent && npx playwright test --grep-invert @after-restart"
      - name: E2E — M2 gate survives a studio restart
        run: |
          $STACK --env-file "$RUNNER_TEMP/studio.env" restart studio
          $STACK --env-file "$RUNNER_TEMP/studio.env" up -d --no-build --wait --wait-timeout 120 studio
          docker run --rm --network host -e CI=1 -e SV_STUDIO_URL=http://localhost:3000 \
            -e SV_REPO=/repo -v "$PWD":/repo -w /repo/modules/simvehicleapp-studio/e2e \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -c "npm install --no-audit --no-fund --silent && npx playwright test --grep @after-restart"
      - name: Stack logs on failure
        if: failure()
        run: $STACK --env-file "$RUNNER_TEMP/studio.env" logs --tail 200
      - name: Golden sim-state.json exported from the canvas (M03-T13; must match the committed files)
        if: always()
        run: git status --porcelain modules/simvehicleapp-contracts/fixtures/golden && git diff --stat modules/simvehicleapp-contracts/fixtures/golden
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: golden-sim-state
          path: modules/simvehicleapp-contracts/fixtures/golden/*/sim-state.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-report
          path: modules/simvehicleapp-studio/e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  license-scan:
    name: license scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install module dependencies (frozen lockfiles)
        run: |
          bun install --frozen-lockfile --cwd modules/simvehicleapp-contracts
          bun install --frozen-lockfile --cwd modules/simvehicleapp-core
          bun install --frozen-lockfile --cwd modules/simvehicleapp-studio
          bun install --frozen-lockfile --cwd modules/simvehicleapp-studio/e2e
          bun install --frozen-lockfile --cwd modules/compiler-code-cpp/generator
      - run: scripts/license/scan.sh

  contracts:
    name: simvehicleapp-contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/simvehicleapp-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: Diagnostic codes are never removed or renamed (ADR-0016 §2)
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git fetch --quiet --depth=1 origin "$BASE"; then
            python3 scripts/ci/diagnostics_guard.py --base "$BASE"
          else
            echo "diagnostics-guard: no base revision for this event — skipped"
          fi

  core:
    name: simvehicleapp-core
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/simvehicleapp-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: SVX parser fuzz (30 s, seeded; full 10-minute run is M3 gate evidence)
        run: bun packages/expr/src/fuzz.ts 30 ${{ github.run_id }}

  codegen-cpp:
    name: compiler-code-cpp (generator, runtime, conformance P1)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/compiler-code-cpp/generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Generator — golden C++ GW-A…G (diff = 0), determinism, contract shapes, string/identifier fuzz
        run: bun test
      - name: Runtime unit tests (gtest)
        run: |
          cmake -S ../runtime -B ../build/rt -DCMAKE_BUILD_TYPE=Debug
          cmake --build ../build/rt -j 4
          ctest --test-dir ../build/rt --output-on-failure
      - name: Runtime under ThreadSanitizer (M6 gate "TSAN clean"; setarch -R = no ASLR, needed by TSAN on recent kernels)
        run: |
          cmake -S ../runtime -B ../build/rt-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-fsanitize=thread
          cmake --build ../build/rt-tsan -j 4
          setarch -R ../build/rt-tsan/runtime_test
      - name: Conformance P1 — 38 conformance + 7 goldens, generated C++ on the runtime (ASan/UBSan)
        env:
          SV_CONF_JOBS: "4"
          SV_CONF_CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        run: conformance/conformance.sh

  codegen-cpp-determinism:
    name: compiler-code-cpp determinism on a second OS (M06-T20)
    runs-on: macos-14
    defaults:
      run:
        working-directory: modules/compiler-code-cpp/generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Same golden bytes as on Linux (golden C++ diff = 0 + generate twice)
        run: bun test src/generator.test.ts

  core-image:
    name: core images build + vss-catalog/compiler smoke
    runs-on: ubuntu-24.04
    env:
      # Own project name: `down -v` must never touch the developer stack (project "simvehicleapp") if run locally.
      COMPOSE: docker compose -p sv-ci-core --env-file scripts/ci/ci.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $COMPOSE build contracts && $COMPOSE build vss-catalog compiler
      - run: $COMPOSE up -d --wait --wait-timeout 60 vss-catalog compiler
      - name: Smoke the running service (auth, seeds, ETag)
        run: |
          $COMPOSE exec -T vss-catalog bun -e '
            const h = { "x-sv-internal": process.env.INTERNAL_API_SECRET };
            const get = (p, x = {}) => fetch("http://127.0.0.1:4010" + p, { headers: { ...h, ...x } });
            const must = (c, m) => { if (!c) { console.error("FAIL", m); process.exit(1); } console.log("ok", m); };
            must((await fetch("http://127.0.0.1:4010/releases")).status === 401, "no secret => 401");
            const rel = await (await get("/releases")).json();
            must(JSON.stringify(rel.releases.map((r) => r.release)) === "[\"v4.0\",\"v4.2\"]", "seeded v4.0 + v4.2");
            const tree = await get("/tree?depth=16");
            must((await tree.json()).nodes.length === 1196, "v4.0 tree below root has 1196 nodes");
            must((await get("/tree?depth=16", { "if-none-match": tree.headers.get("etag") })).status === 304, "ETag => 304");
            const nodes = await (await get("/nodes?paths=Vehicle.Speed&release=v4.2")).json();
            must(nodes.nodes[0].kind === "sensor" && nodes.release === "v4.2", "v4.2 lookup");'
          $COMPOSE exec -T -e SPECS=$(ls -d modules/simvehicleapp-core/packages/blocks/sv_*/ | wc -l) compiler bun -e '
            const res = await fetch("http://127.0.0.1:4020/blocks", { headers: { "x-sv-internal": process.env.INTERNAL_API_SECRET } });
            const types = (await res.json()).blocks.map((b) => b.type);
            const want = ["sv_on_signal_changed", "sv_read_attribute", "sv_read_signal", "sv_set_actuator"];
            if (res.status !== 200 || types.length !== Number(process.env.SPECS) || !want.every((t) => types.includes(t))) { console.error("FAIL /blocks", res.status, types); process.exit(1); }
            console.log("ok compiler /blocks", types.length, "specs");'
          $COMPOSE exec -T compiler bun -e '
            const graph = { graphVersion: "1.0.0", workflowId: "smoke", revision: 1, name: "smoke", vss: { release: "v4.2" }, variables: [],
              blocks: [{ id: "b1", type: "sv_read_attribute", name: "Refuel", props: { path: "Vehicle.Body.RefuelPosition" }, parentId: null },
                       { id: "b2", type: "sv_read_signal", name: "Nope", props: { path: "Vehicle.Nope" }, parentId: null }], edges: [] };
            const res = await fetch("http://127.0.0.1:4020/lint", { method: "POST", headers: { "x-sv-internal": process.env.INTERNAL_API_SECRET, "content-type": "application/json" }, body: JSON.stringify({ graph }) });
            const codes = (await res.json()).diagnostics.map((d) => d.code).sort().join(",");
            const want = "BLOCK_UNREACHABLE,BLOCK_UNREACHABLE,VEHICLE_PATH_DEPRECATED,VEHICLE_PATH_NOT_FOUND";
            if (res.status !== 200 || codes !== want) { console.error("FAIL /lint", res.status, codes); process.exit(1); }
            console.log("ok compiler /lint via vss-catalog", codes);'
      - name: C++ backend image (codegen-cpp) — isolation and S7/generate through the compiler (M06-T11, gate "no egress")
        run: |
          $COMPOSE build codegen-cpp && $COMPOSE up -d --wait --wait-timeout 60 codegen-cpp
          $COMPOSE exec -T codegen-cpp bun -e '
            const h = { "x-sv-internal": process.env.INTERNAL_API_SECRET };
            const must = (c, m) => { if (!c) { console.error("FAIL", m); process.exit(1); } console.log("ok", m); };
            must((await fetch("http://127.0.0.1:4110/capabilities")).status === 401, "no secret => 401");
            const caps = await (await fetch("http://127.0.0.1:4110/capabilities", { headers: h })).json();
            must(caps.id === "cpp" && caps.opcodes.length === 24, "capabilities: cpp, 24 opcodes");
            let egress = "blocked";
            try { await fetch("https://github.com", { signal: AbortSignal.timeout(5000) }); egress = "OPEN"; } catch {}
            must(egress === "blocked", "no network egress (internal network)");
            let writable = true;
            try { await Bun.write("/src/probe", "x"); } catch { writable = false; }
            must(!writable, "read-only filesystem");'
          $COMPOSE exec -T -e G="$(base64 -w0 modules/simvehicleapp-contracts/fixtures/golden/GW-A/graph.json)" compiler bun -e '
            const h = { "x-sv-internal": process.env.INTERNAL_API_SECRET, "content-type": "application/json" };
            const must = (c, m) => { if (!c) { console.error("FAIL", m); process.exit(1); } console.log("ok", m); };
            const graph = JSON.parse(Buffer.from(process.env.G, "base64").toString());
            const r = await (await fetch("http://127.0.0.1:4020/compile", { method: "POST", headers: h, body: JSON.stringify({ graph, mode: "build", target: "cpp" }) })).json();
            must(r.ir && r.diagnostics.every((d) => d.severity !== "error"), "compile GW-A with target cpp (S7 reads codegen-cpp /capabilities)");
            const g = await fetch("http://codegen-cpp:4110/generate", { method: "POST", headers: h, body: JSON.stringify({ project: { slug: "gw-a", appName: "GwaApp", language: "cpp", mqttTopicPrefix: "x", traceLevel: "node" }, workflows: [r.ir] }) });
            const fs = await g.json();
            must(g.status === 200 && fs.files.some((f) => f.path.endsWith("workflows/StableOverspeedWarning.cpp")), "generate over the internal network");'
      - if: always()
        run: $COMPOSE logs vss-catalog compiler codegen-cpp && $COMPOSE down -v
