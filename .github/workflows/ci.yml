# Shared CI (M00-T08): compose lint, contract-only-deps, license scan + module checks.
# Rules: AGENTS §2, ADR-0004, ADR-0005, ADR-0009. Actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-selftest:
    name: CI checks reject violations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts/ci/tests -v

  compose-lint:
    name: compose lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose version
      - run: python3 scripts/ci/compose_lint.py

  contract-only-deps:
    name: contract-only-deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/ci/contract_only_deps.py

  license-scan:
    name: license scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - name: Install module dependencies (frozen lockfiles)
        run: bun install --frozen-lockfile --cwd modules/simvehicleapp-contracts
      - run: scripts/license/scan.sh

  contracts:
    name: simvehicleapp-contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/simvehicleapp-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
