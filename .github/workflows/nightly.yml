# Nightly live smoke (M08-T10): the whole SynCode + live-run path on a fresh stack built from source —
# toolchain image (Velocitas devcontainer + offline Conan seed + agent), core, codegen-cpp, orchestration
# services, KUKSA databrokers, Mosquitto — then scripts/smoke.sh (M7 + M8 gates) and the M9 export build
# + license PDP. Too heavy for every push.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Pushes scan dependencies only when a lockfile changes (ci.yml `deps`); new advisories appear without any
  # change on our side, so every lockfile is scanned each night as well.
  osv-scan:
    name: dependency vulnerabilities (osv-scanner, nightly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SimVehicleApp modules — no known vulnerability (M11-T06)
        run: |
          for f in modules/simvehicleapp-contracts/bun.lock modules/simvehicleapp-core/bun.lock modules/simvehicleapp-orchestrator/bun.lock \
                   modules/simvehicleapp-ai/bun.lock modules/compiler-code-cpp/generator/bun.lock modules/compiler-code-python/generator/bun.lock modules/compiler-code-rust/generator/bun.lock \
                   modules/velocitas-stack/toolchain/agent/bun.lock; do
            docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/$f
          done
      - name: Studio (Sim fork dependencies) — report only (ADR-0008 wave 3b)
        continue-on-error: true
        run: docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/modules/simvehicleapp-studio/bun.lock

  wasm:
    name: WebAssembly apps (ADR-0061) — conformance, parity P3, ADAS live for cpp-wasm and rust-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: .env with fresh secrets and the wasm profile
        run: |
          cp .env.example .env
          for k in BETTER_AUTH_SECRET ENCRYPTION_KEY API_ENCRYPTION_KEY INTERNAL_API_SECRET; do echo "$k=$(openssl rand -hex 32)" >> .env; done
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "COMPOSE_PROFILES=rust,wasm" >> .env
          echo "SV_BACKENDS=cpp=http://codegen-cpp:4110,cpp-wasm=http://codegen-cpp:4110/wasm,rust-wasm=http://codegen-rust:4130/wasm" >> .env
          echo "SV_TOOLCHAINS=cpp-wasm=http://toolchain-wasm:4240,rust-wasm=http://toolchain-wasm:4240" >> .env
      - name: Build images from source (the toolchain copies the runtimes from the codegen images and the host)
        run: |
          docker compose build contracts
          docker compose build vss-catalog compiler codegen-cpp codegen-rust orchestrator workspace signal-gateway wasm-host
          docker compose build toolchain-wasm
      - name: Start the stack
        run: |
          docker compose up -d --no-build --wait --wait-timeout 300 \
            studio-db databroker databroker-v4-2 mqtt vss-catalog compiler codegen-cpp codegen-rust toolchain-wasm workspace orchestrator signal-gateway
          docker compose ps
      - name: Conformance — every golden and conformance case in the guest (m20-wasm-conformance.sh)
        run: |
          modules/simvehicleapp-orchestrator/gate/m20-wasm-conformance.sh cpp
          modules/simvehicleapp-orchestrator/gate/m20-wasm-conformance.sh rust
      - name: Parity P3 — GW-A…G as WebAssembly apps on kuksa.val.v2
        run: |
          SV_PARITY_LANGUAGE=cpp SV_PARITY_TARGET=wasm SV_PARITY_REPORT=$PWD/parity/parity-wasm-cpp.json modules/simvehicleapp-orchestrator/gate/parity-p3.sh
          SV_PARITY_LANGUAGE=rust SV_PARITY_TARGET=wasm SV_PARITY_REPORT=$PWD/parity/parity-wasm-rust.json modules/simvehicleapp-orchestrator/gate/parity-p3.sh
      - name: ADAS live — create, SynCode, run and play on the stack
        run: |
          modules/simvehicleapp-orchestrator/gate/adas-live.sh cpp C43-adas-forward-collision wasm
          modules/simvehicleapp-orchestrator/gate/adas-live.sh rust C43-adas-forward-collision wasm
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 300 orchestrator workspace toolchain-wasm codegen-cpp codegen-rust signal-gateway

  live-smoke:
    name: live smoke (SynCode + GW-A live on the real stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disk space and swap (toolchain image + Conan cache are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          sudo swapoff -a || true
          # private-repo runners may lack a large /mnt: size the swap from the free space, keep 12 GB for images
          dir=/mnt
          avail=$( (df -BG --output=avail /mnt 2>/dev/null || echo 0) | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 20 ]; then dir=/var/tmp; avail=$(df -BG --output=avail / | tail -1 | tr -dc 0-9); fi
          size=$(( ${avail:-0} - 12 )); [ "$size" -gt 8 ] && size=8; [ "$size" -lt 2 ] && size=2
          sudo fallocate -l "${size}G" "$dir/sv-swapfile" && sudo chmod 600 "$dir/sv-swapfile"
          sudo mkswap "$dir/sv-swapfile" && sudo swapon "$dir/sv-swapfile"
          df -h / "$dir" && free -h
      - name: .env with fresh secrets
        run: |
          cp .env.example .env
          for k in BETTER_AUTH_SECRET ENCRYPTION_KEY API_ENCRYPTION_KEY INTERNAL_API_SECRET; do echo "$k=$(openssl rand -hex 32)" >> .env; done
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "SV_CONAN_JOBS=4" >> .env
      - name: Build images from source (order of scripts/sv build; no studio/IDE — the smoke drives the APIs)
        run: |
          docker compose build contracts
          docker compose build devcontainer-cpp toolchain-cpp
          docker compose build vss-catalog compiler codegen-cpp orchestrator workspace signal-gateway
      - name: Start the stack
        run: |
          docker compose up -d --no-build --wait --wait-timeout 300 \
            studio-db databroker databroker-v4-2 mqtt vss-catalog compiler codegen-cpp toolchain-cpp workspace orchestrator signal-gateway
          docker compose ps
      - name: Live smoke (scripts/smoke.sh)
        run: scripts/smoke.sh
      - name: M9 gate — export builds outside SimVehicleApp (template app/Dockerfile on this clean runner), license PDP
        run: SV_GATE_SKIP_IDE=1 SV_GATE_EXPORT_BUILD=1 modules/simvehicleapp-orchestrator/gate/m9-gate.sh
      - name: Parity P3 — GW-A…G as real apps on the KUKSA databroker vs the frozen traces (ADR-0042, M11-T01)
        run: SV_PARITY_REPORT=$PWD/parity/parity-p3.json modules/simvehicleapp-orchestrator/gate/parity-p3.sh
      - name: Custom VSS model (ADR-0052) — overlay release, SynCode + live run, then a model change on the same project
        run: modules/simvehicleapp-orchestrator/gate/vss-custom-gate.sh v4.0-acme cpp
      - name: M16 capacity (ADR-0053) — quotas, one queued SynCode per app, Clean measured with du, disk thresholds, repair, sweeper, delete
        run: modules/simvehicleapp-orchestrator/gate/m16-capacity.sh
      - name: Parity dashboard (report artifact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-p3
          path: parity/parity-p3.json
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 300 orchestrator workspace toolchain-cpp signal-gateway codegen-cpp
