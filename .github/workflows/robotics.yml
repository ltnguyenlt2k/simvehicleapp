name: Robotics
on:
  push:
    paths: ['robotics/**', '.github/workflows/robotics.yml']
  pull_request:
    paths: ['robotics/**', '.github/workflows/robotics.yml']
jobs:
  foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, repository baseline pin
      - run: bash robotics/scripts/sr precheck
      - run: bash robotics/scripts/sr build
      - run: bash robotics/scripts/sr test
      - name: Expose foundation failure details in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('robotics/runtime/ci-tests').glob('*.log'):
              content=path.read_text(errors='replace')
              if 'FAILED' in content or 'Traceback' in content:
                  tail=content[-12000:]
                  for index in range(0,len(tail),2000):
                      detail=tail[index:index+2000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print(f'::error file={path},title=Robotics foundation failure part {index//2000+1}::{detail}')
          PY
      - name: Retain foundation test output including failed assertions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robotics-foundation-tests
          path: robotics/runtime/ci-tests/
      - run: bash robotics/scripts/sr smoke
      - name: RobotFlow closed artifact contracts
        run: |
          docker compose -f robotics/compose.yaml --profile compiler-tools build robotflow
          docker compose -f robotics/compose.yaml --profile compiler-tools run --rm --no-deps robotflow
      - name: RobotFlow runtime integrity and typed values
        run: |
          docker compose -f robotics/compose.yaml --profile runtime-tools build rfrt
          docker compose -f robotics/compose.yaml --profile runtime-tools run --rm --no-deps rfrt
      - name: Independent broker/provider process and network faults
        run: python3 robotics/scripts/fault-test.py
      - name: Stop only this robot stack after fault tests
        if: always()
        run: docker compose -f robotics/compose.yaml down
      - name: Retain independent-process fault evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, repository baseline pin
        with:
          name: robotics-process-faults
          path: robotics/runtime/m23/process-faults/
      - name: Native generated-app conformance C-R01-C-R12 twice
        run: python3 robotics/conformance/gate.py
      - name: Retain native conformance including failed runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robotics-native-conformance
          path: robotics/runtime/m25/conformance/
      - name: Native developer CLI and RW-A-D on isolated mock
        run: python3 robotics/conformance/cli_gate.py
      - name: Retain native developer CLI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robotics-native-cli
          path: robotics/runtime/t08/
      - name: Build pinned ROS message interface without private source access
        run: docker build -f robotics/protobus/spikes/interfaces.Dockerfile -t sr-dog-interfaces:ci robotics/protobus
      - run: docker run --rm --network none sr-dog-interfaces:ci
      - name: Build Humble provider image and verify Python 3.10 / CycloneDDS / pinned messages
        run: |
          docker build -f robotics/protobus/bridge-ros2.Dockerfile -t sr-protobus-ros2:ci robotics/protobus
          docker run --rm --network none --cpus 1 --memory 256m --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true sr-protobus-ros2:ci
          docker run --rm --network none sr-protobus-ros2:ci python3 -m pip check
          docker run --rm --network none --cpus 2 --memory 256m --read-only --tmpfs /tmp sr-protobus-ros2:ci python3 -m unittest discover -s tests -p test_mapping.py -v
          docker run --rm --network none --cpus 2 --memory 256m --read-only --tmpfs /tmp sr-protobus-ros2:ci python3 -m unittest discover -s tests -p 'test_dog_*.py' -v
          docker run --rm --network none --cpus 2 --memory 256m --read-only --tmpfs /tmp sr-protobus-ros2:ci python3 -m unittest discover -s bridge_tests -v
      - name: Nonroot runner process, OOM and mode network spikes
        run: |
          mkdir -p robotics/runtime/m26
          docker build -f robotics/runner/Dockerfile -t sr-runner:spike robotics
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --memory 256m --pids-limit 128 sr-runner:spike > robotics/runtime/m26/runner-tests-ci.log 2>&1
          python3 robotics/runner/spikes/qualify.py > robotics/runtime/m26/runner-native-ci.log 2>&1
      - name: Pure compiler HTTP contracts and installed artifact verification
        run: |
          docker build -f robotics/robotflow/service.Dockerfile -t sr-rflowc-api:dev robotics
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --memory 256m sr-rflowc-api:dev python -m unittest discover -s service_tests -v > robotics/runtime/m26/compiler-http-ci.log 2>&1
          python3 robotics/robotflow/service_tests/qualify.py > robotics/runtime/m26/compiler-http-tcp-ci.log 2>&1
      - name: Static React Flow 200-node headed browser spike
        run: |
          export SR_DEV_UID="$(id -u)" SR_DEV_GID="$(id -g)"
          docker build --target builder -t sr-studio-web-builder:spike robotics/studio/web
          docker build -t sr-studio-web:spike robotics/studio/web
          docker build -f robotics/studio/web/browser.Dockerfile -t sr-studio-browser:spike robotics/studio/web
          docker compose -f robotics/studio/spikes/compose.yaml up -d web
          docker compose -f robotics/studio/spikes/compose.yaml --profile tools run --rm browser > robotics/runtime/m26/canvas-ci.log 2>&1
      - name: Stop only Studio spike services
        if: always()
        run: docker compose -f robotics/studio/spikes/compose.yaml down
      - name: Studio API, actual native backend, editor and scenario PASS/FAIL
        run: python3 robotics/studio/ci.py > robotics/runtime/m26/studio-ci.log 2>&1
      - name: Preserve the qualified production images for local live acceptance
        run: |
          mkdir -p robotics/runtime/ci-images
          docker save -o robotics/runtime/ci-images/robot-studio.tar sr-studio-web:dev sr-studio-api:dev sr-runner:dev sr-rflowc-api:dev sr-protobus:dev sr-protobus-ros2:ci
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('robotics/runtime/ci-images')
          names=['sr-studio-web:dev','sr-studio-api:dev','sr-runner:dev','sr-rflowc-api:dev','sr-protobus:dev','sr-protobus-ros2:ci']
          images=json.loads(subprocess.check_output(['docker','image','inspect']+names,text=True))
          metadata={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'images':[{"tags":item['RepoTags'],"id":item['Id']} for item in images]}
          digest=hashlib.sha256()
          with (root/'robot-studio.tar').open('rb') as stream:
              for chunk in iter(lambda:stream.read(1024*1024),b''):digest.update(chunk)
          metadata['archiveSha256']=digest.hexdigest()
          (root/'manifest.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
      - name: Retain qualified images with source identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robot-studio-qualified-images
          path: robotics/runtime/ci-images/
          compression-level: 1
          retention-days: 7
      - name: Retain Studio and runner spike failures and measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robotics-studio-spikes
          path: robotics/runtime/m26/
      - name: Scan the independent robot stack dependency locks
        run: |
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/rss/requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/protobus/requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/protobus/bridge-requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/protobus/bridge-build-requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/robotflow/requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/rfrt/requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/rfrt/build-requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/studio/api/requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/studio/control-requirements.txt
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --lockfile=/src/robotics/studio/web/package-lock.json
