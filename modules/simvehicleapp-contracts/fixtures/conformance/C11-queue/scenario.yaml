# C11-queue — queue runs events one after another, in arrival order, each with its own trigger value
# Semantics: ADR-0012 §4 queue. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C11-queue
description: "queue runs events one after another, in arrival order, each with its own trigger value"
vss:
  release: v4.0
until: 5000
initial:
  Vehicle.Speed: 0
  Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed: 0
inputs:
  - { t: 1000, path: "Vehicle.Speed", value: 10 }
  - { t: 1100, path: "Vehicle.Speed", value: 20 }
  - { t: 1200, path: "Vehicle.Speed", value: 30 }
expect:
  writes:
    - { t: 2000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 10 }
    - { t: 3000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 20 }
    - { t: 4000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 30 }
