# C24-wait-until-ok — wait_until continues on ok when the condition becomes true
# Semantics: 05 §2.5 sv_wait_until. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C24-wait-until-ok
description: "wait_until continues on ok when the condition becomes true"
vss:
  release: v4.0
until: 6000
initial:
  Vehicle.Speed: 0
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 2000, path: "Vehicle.Speed", value: 150 }
expect:
  writes:
    - { t: 2000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
