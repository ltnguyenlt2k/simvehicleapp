# C17-app-start-once — When app starts fires exactly once at t=0
# Semantics: 05 §2.1 app_start. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C17-app-start-once
description: "When app starts fires exactly once at t=0"
vss:
  release: v4.0
until: 3000
initial:
  Vehicle.Speed: 0
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 1000, path: "Vehicle.Speed", value: 10 }
expect:
  writes:
    - { t: 0, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
