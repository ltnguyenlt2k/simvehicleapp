# C13-parallel — parallel lets runs overlap; each keeps its own trigger value
# Semantics: ADR-0012 §4 parallel. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C13-parallel
description: "parallel lets runs overlap; each keeps its own trigger value"
vss:
  release: v4.0
until: 4000
initial:
  Vehicle.Body.Raindetection.Intensity: 0
  Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed: 0
inputs:
  - { t: 1000, path: "Vehicle.Body.Raindetection.Intensity", value: 10 }
  - { t: 1100, path: "Vehicle.Body.Raindetection.Intensity", value: 20 }
  - { t: 1200, path: "Vehicle.Body.Raindetection.Intensity", value: 30 }
expect:
  writes:
    - { t: 2000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 10 }
    - { t: 2100, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 20 }
    - { t: 2200, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 30 }
