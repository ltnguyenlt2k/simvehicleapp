# C12-queue-overflow — queueMax 8: an overflowing event drops the oldest queued one
# Semantics: 05 §3.2 queueMax. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C12-queue-overflow
description: "queueMax 8: an overflowing event drops the oldest queued one"
vss:
  release: v4.0
until: 12000
initial:
  Vehicle.Body.Raindetection.Intensity: 0
  Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed: 0
inputs:
  - { t: 1000, path: "Vehicle.Body.Raindetection.Intensity", value: 1 }
  - { t: 1001, path: "Vehicle.Body.Raindetection.Intensity", value: 2 }
  - { t: 1002, path: "Vehicle.Body.Raindetection.Intensity", value: 3 }
  - { t: 1003, path: "Vehicle.Body.Raindetection.Intensity", value: 4 }
  - { t: 1004, path: "Vehicle.Body.Raindetection.Intensity", value: 5 }
  - { t: 1005, path: "Vehicle.Body.Raindetection.Intensity", value: 6 }
  - { t: 1006, path: "Vehicle.Body.Raindetection.Intensity", value: 7 }
  - { t: 1007, path: "Vehicle.Body.Raindetection.Intensity", value: 8 }
  - { t: 1008, path: "Vehicle.Body.Raindetection.Intensity", value: 9 }
  - { t: 1009, path: "Vehicle.Body.Raindetection.Intensity", value: 10 }
expect:
  writes:
    - { t: 2000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 1 }
    - { t: 3000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 3 }
    - { t: 4000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 4 }
    - { t: 5000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 5 }
    - { t: 6000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 6 }
    - { t: 7000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 7 }
    - { t: 8000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 8 }
    - { t: 9000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 9 }
    - { t: 10000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 10 }
  trace:
    - {"ev": "error", "data": {"reason": "queue_overflow"}}
