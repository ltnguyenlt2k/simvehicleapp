# C07-debounce — Debounce fires once, debounceMs after the last change of a burst
# Semantics: 05 §2.1 debounceMs. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C07-debounce
description: "Debounce fires once, debounceMs after the last change of a burst"
vss:
  release: v4.0
until: 5000
initial:
  Vehicle.Speed: 0
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 1000, path: "Vehicle.Speed", value: 10 }
  - { t: 1200, path: "Vehicle.Speed", value: 20 }
  - { t: 1400, path: "Vehicle.Speed", value: 30 }
  - { t: 3000, path: "Vehicle.Speed", value: 40 }
expect:
  writes:
    - { t: 1900, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
    - { t: 3500, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
