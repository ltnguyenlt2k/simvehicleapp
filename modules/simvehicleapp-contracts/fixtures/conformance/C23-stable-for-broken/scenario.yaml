# C23-stable-for-broken — stable_for takes broken as soon as the condition turns false
# Semantics: 05 §2.5 sv_stable_for. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C23-stable-for-broken
description: "stable_for takes broken as soon as the condition turns false"
vss:
  release: v4.0
until: 5000
initial:
  Vehicle.Speed: 150
  Vehicle.IsMoving: false
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 1000, path: "Vehicle.IsMoving", value: true }
  - { t: 2000, path: "Vehicle.Speed", value: 50 }
expect:
  writes:
    - { t: 2000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: false }
