# C01-any-change — Any change fires once per changed value; equal value does not fire
# Semantics: 05 §2.1 mode any. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C01-any-change
description: "Any change fires once per changed value; equal value does not fire"
vss:
  release: v4.0
until: 4000
initial:
  Vehicle.Speed: 0
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 1000, path: "Vehicle.Speed", value: 10 }
  - { t: 2000, path: "Vehicle.Speed", value: 10 }
  - { t: 3000, path: "Vehicle.Speed", value: 20 }
expect:
  writes:
    - { t: 1000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
    - { t: 3000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
