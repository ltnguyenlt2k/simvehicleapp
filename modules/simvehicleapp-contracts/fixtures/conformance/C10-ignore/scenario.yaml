# C10-ignore — ignore drops events while a run is active; the next event after it ends starts a run
# Semantics: ADR-0012 §4 ignore. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C10-ignore
description: "ignore drops events while a run is active; the next event after it ends starts a run"
vss:
  release: v4.0
until: 5000
initial:
  Vehicle.Speed: 0
  Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed: 0
inputs:
  - { t: 1000, path: "Vehicle.Speed", value: 10 }
  - { t: 1500, path: "Vehicle.Speed", value: 20 }
  - { t: 2500, path: "Vehicle.Speed", value: 30 }
expect:
  writes:
    - { t: 2000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 10 }
    - { t: 3500, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 30 }
