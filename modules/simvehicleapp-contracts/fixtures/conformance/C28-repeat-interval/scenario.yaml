# C28-repeat-interval — intervalMs pauses between iterations, not after the last one
# Semantics: 05 §2.5 sv_repeat. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C28-repeat-interval
description: "intervalMs pauses between iterations, not after the last one"
vss:
  release: v4.0
until: 4000
initial:
  Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed: 9
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs: []
expect:
  writes:
    - { t: 0, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 0 }
    - { t: 1000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 1 }
    - { t: 2000, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 2 }
    - { t: 2000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
