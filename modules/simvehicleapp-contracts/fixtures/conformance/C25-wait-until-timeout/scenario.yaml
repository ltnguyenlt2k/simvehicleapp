# C25-wait-until-timeout — wait_until continues on timeout after timeoutMs
# Semantics: 05 §2.5 sv_wait_until. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C25-wait-until-timeout
description: "wait_until continues on timeout after timeoutMs"
vss:
  release: v4.0
until: 6000
initial:
  Vehicle.Speed: 0
  Vehicle.Body.Lights.Hazard.IsSignaling: true
inputs:
  - { t: 2000, path: "Vehicle.Speed", value: 50 }
expect:
  writes:
    - { t: 5000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: false }
