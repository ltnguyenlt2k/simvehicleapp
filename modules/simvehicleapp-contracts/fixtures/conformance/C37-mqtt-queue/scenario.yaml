# C37-mqtt-queue — MQTT trigger queues messages by default and runs them in order
# Semantics: 05 §2.1 sv_on_mqtt. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C37-mqtt-queue
description: "MQTT trigger queues messages by default and runs them in order"
vss:
  release: v4.0
until: 3000
initial:
  Vehicle.Body.Windshield.Front.Wiping.Mode: "OFF"
inputs:
  - { t: 1000, topic: "vehicle/cmd/wiper", value: "SLOW" }
  - { t: 1100, topic: "vehicle/cmd/wiper", value: "FAST" }
expect:
  writes:
    - { t: 1500, path: "Vehicle.Body.Windshield.Front.Wiping.Mode", value: "SLOW" }
    - { t: 2000, path: "Vehicle.Body.Windshield.Front.Wiping.Mode", value: "FAST" }
