# C20-if-else — If/Else takes then when the condition is true, else otherwise
# Semantics: 05 §2.5 sv_if. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C20-if-else
description: "If/Else takes then when the condition is true, else otherwise"
vss:
  release: v4.0
until: 3000
initial:
  Vehicle.Speed: 0
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 1000, path: "Vehicle.Speed", value: 50 }
  - { t: 2000, path: "Vehicle.Speed", value: 150 }
expect:
  writes:
    - { t: 1000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: false }
    - { t: 2000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
