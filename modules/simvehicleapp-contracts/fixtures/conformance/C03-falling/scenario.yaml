# C03-falling — Falling fires only when the value decreases
# Semantics: 05 §2.1 mode falling. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C03-falling
description: "Falling fires only when the value decreases"
vss:
  release: v4.0
until: 4000
initial:
  Vehicle.Speed: 0
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 1000, path: "Vehicle.Speed", value: 10 }
  - { t: 2000, path: "Vehicle.Speed", value: 5 }
  - { t: 3000, path: "Vehicle.Speed", value: 7 }
expect:
  writes:
    - { t: 2000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
