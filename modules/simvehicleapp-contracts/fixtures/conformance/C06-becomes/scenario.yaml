# C06-becomes — becomes fires when the value turns equal to the threshold
# Semantics: 05 §2.1 becomes. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C06-becomes
description: "becomes fires when the value turns equal to the threshold"
vss:
  release: v4.0
until: 5000
initial:
  Vehicle.IsMoving: false
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs:
  - { t: 1000, path: "Vehicle.IsMoving", value: true }
  - { t: 2000, path: "Vehicle.IsMoving", value: true }
  - { t: 3000, path: "Vehicle.IsMoving", value: false }
  - { t: 4000, path: "Vehicle.IsMoving", value: true }
expect:
  writes:
    - { t: 1000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
    - { t: 4000, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
