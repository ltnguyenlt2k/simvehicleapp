# C27-repeat — repeat runs its body count times with <loop.index> 0…n-1, then continues
# Semantics: 05 §2.5 sv_repeat. Hand-derived expectation (M03-T12); the simulator (M5) and every runtime must reproduce it.
scenarioVersion: 1.0.0
name: C27-repeat
description: "repeat runs its body count times with <loop.index> 0…n-1, then continues"
vss:
  release: v4.0
until: 1000
initial:
  Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed: 9
  Vehicle.Body.Lights.Hazard.IsSignaling: false
inputs: []
expect:
  writes:
    - { t: 0, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 0 }
    - { t: 0, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 1 }
    - { t: 0, path: "Vehicle.Cabin.HVAC.Station.Row1.Driver.FanSpeed", value: 2 }
    - { t: 0, path: "Vehicle.Body.Lights.Hazard.IsSignaling", value: true }
