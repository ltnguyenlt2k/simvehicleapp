openapi: 3.1.0
info:
  title: SimVehicleApp Signal Gateway API
  version: 1.0.0-alpha.1
  description: "Bridge to KUKSA databroker via kuksa.val.v1 (ADR-0024 §4, analysis/08 §4): signal stream (SSE), inject, actuator mirroring, scenario playback. Only paths of the release catalog."
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://signal-gateway:4050
    description: Compose internal network (not published to the host).
security:
  - internal: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [service]
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1#/$defs/health" }
  /version:
    get:
      operationId: version
      tags: [service]
      security: []
      responses:
        "200":
          description: Name, version, commit and contracts version (ADR-0007 §7).
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1" }
  /signals:
    get:
      operationId: streamSignals
      tags: [signals]
      description: "SSE of SignalUpdate v1 (`event: signal`) for the paths: the current value/target of each first, then every change with its `source` (ADR-0062 §3). Replaces the WebSocket of the skeleton (ADR-0027 Notes 2026-10-07: the studio BFF relays SSE, Next.js route handlers cannot proxy a WebSocket)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/Release" }
        - { $ref: "#/components/parameters/Sandbox" }
        - { $ref: "#/components/parameters/Paths" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
              x-sv-event-data: { $ref: "urn:simvehicleapp:contracts:signal-update:1.0.0-alpha.1" }
        "400": { $ref: "#/components/responses/Rejected" }
        "503": { description: "No databroker for this release, or it is unreachable." }
    post:
      operationId: setSignal
      tags: [signals]
      description: "Injects a value: `value` = current value (sensor, attribute, actuator — the feeder/provider role), `target` = actuator target. Only paths of the release catalog; the value must fit the datatype, min/max and allowed values."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release, path, value, field]
              additionalProperties: false
              properties:
                release: { type: string, pattern: "^v[0-9]+\\.[0-9]+(-[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)?$" }
                sandbox: { $ref: "#/components/schemas/Sandbox" }
                path: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/vssPath" }
                value: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/jsonValue" }
                field: { $ref: "urn:simvehicleapp:contracts:signal-update:1.0.0-alpha.1#/$defs/field" }
      responses:
        "200":
          description: Written.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:signal-update:1.0.0-alpha.1" }
        "400": { $ref: "#/components/responses/Rejected" }
        "422": { $ref: "#/components/responses/Rejected" }
        "409": { description: "`SIMULATED_INPUT_DISABLED`: the sandbox is a deployment (vehicle-gateway:<port>, ADR-0060) — its signals come from the deploy target." }
        "503": { description: "No databroker for this release, or it is unreachable." }
  /mirror:
    put:
      operationId: setMirror
      tags: [signals]
      description: "Actuators whose target is copied to their current value (the provider role in dev runs, ADR-0024 Notes M0): the orchestrator sets the actuators the running app writes, an empty list stops mirroring."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release, paths]
              additionalProperties: false
              properties:
                release: { type: string, pattern: "^v[0-9]+\\.[0-9]+(-[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)?$" }
                sandbox: { $ref: "#/components/schemas/Sandbox" }
                paths: { type: array, maxItems: 500, uniqueItems: true, items: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/vssPath" } }
                api:
                  enum: [sdv.databroker.v1, kuksa.val.v2]
                  description: "The databroker API of the running app (ADR-0047 §5). `sdv.databroker.v1` (default): targets are mirrored to current values. `kuksa.val.v2`: the gateway becomes the provider of these actuators (OpenProviderStream); each actuation is accepted and published as the current value."
                publish: { type: boolean, description: "kuksa.val.v2 only: false accepts actuations without publishing them as current values (no vehicle answers: parity gate). Default true." }
      responses:
        "204": { description: Mirroring (or providing) updated. }
        "400": { $ref: "#/components/responses/Rejected" }
        "409": { description: "`provider_refused`: another provider already holds one of the actuators (kuksa.val.v2); `SIMULATED_INPUT_DISABLED`: the sandbox is a deployment (ADR-0060)." }
  /messages:
    get:
      operationId: streamMessages
      tags: [signals]
      description: "SSE of the MQTT messages under an app's topic prefix (subscribes `<prefix>/#`): `event: message` {topic, payload, ts}. HMI notifications are the JSON on `<prefix>/hmi` (ADR-0058 §6)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: prefix, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_\\-]+(/[A-Za-z0-9_\\-]+)*/?$" } }
      responses:
        "200": { description: Event stream., content: { text/event-stream: {} } }
        "400": { $ref: "#/components/responses/Rejected" }
        "503": { description: "MQTT is not configured or unreachable." }
  /play:
    post:
      operationId: playScenario
      tags: [scenarios]
      description: "Plays a scenario v1 on the real databroker (M08-T07): `initial` at once, then each input at its time (signal inputs set the current value, topic inputs are published on MQTT). One playback at a time; a new one replaces it."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release, scenario]
              additionalProperties: false
              properties:
                release: { type: string, pattern: "^v[0-9]+\\.[0-9]+(-[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)?$" }
                sandbox: { $ref: "#/components/schemas/Sandbox" }
                scenario: { $ref: "urn:simvehicleapp:contracts:scenario:1.0.0-alpha.1" }
                observe: { type: array, maxItems: 200, items: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/vssPath" }, description: "Signals to record during the playback (ADR-0058 §4): their target/current changes come back in `observed`." }
      responses:
        "202":
          description: Playing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playback" }
        "400": { $ref: "#/components/responses/Rejected" }
        "409": { description: "`SIMULATED_INPUT_DISABLED`: the sandbox is a deployment (vehicle-gateway:<port>, ADR-0060) — its signals come from the deploy target." }
    get:
      operationId: getPlayback
      tags: [scenarios]
      parameters: [{ $ref: "#/components/parameters/RequestId" }, { $ref: "#/components/parameters/Sandbox" }]
      responses:
        "200":
          description: The current or last playback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playback" }
        "404": { description: Nothing played yet. }
    delete:
      operationId: stopPlayback
      tags: [scenarios]
      parameters: [{ $ref: "#/components/parameters/RequestId" }, { $ref: "#/components/parameters/Sandbox" }]
      responses:
        "204": { description: Stopped (or nothing was playing). }
  /snapshot:
    get:
      operationId: snapshot
      tags: [signals]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/Release" }
        - { $ref: "#/components/parameters/Sandbox" }
        - { $ref: "#/components/parameters/Paths" }
      responses:
        "200":
          description: Current values (and actuator targets).
          content:
            application/json:
              schema:
                type: object
                required: [updates]
                properties:
                  updates: { type: array, items: { $ref: "urn:simvehicleapp:contracts:signal-update:1.0.0-alpha.1" } }
components:
  securitySchemes:
    internal:
      type: apiKey
      in: header
      name: x-sv-internal
      description: INTERNAL_API_SECRET shared by internal services (ADR-0007 §5). Only the studio BFF faces the browser.
  parameters:
    RequestId:
      name: x-sv-request-id
      in: header
      required: false
      description: Correlation id propagated across services (ADR-0007 §6).
      schema: { type: string, maxLength: 128 }
    Release:
      name: release
      in: query
      required: true
      description: "Selects the databroker for this VSS release (SV_DATABROKERS)."
      schema: { type: string, pattern: "^v[0-9]+\\.[0-9]+(-[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)?$" }
    Sandbox:
      name: sandbox
      in: query
      required: false
      description: "A run's own databroker (ADR-0057, `Run.sandbox` of the orchestrator) instead of the release's shared one; `vehicle-gateway:<port>` is a deployment's route to its deploy target (ADR-0060): read only — inject, play and mirror answer 409 SIMULATED_INPUT_DISABLED."
      schema: { $ref: "#/components/schemas/Sandbox" }
    Paths:
      name: paths
      in: query
      required: true
      style: form
      explode: false
      schema: { type: array, minItems: 1, maxItems: 200, items: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/vssPath" } }
  responses:
    Rejected:
      description: "Rejected: unknown path for the release, value of the wrong type/range, or refused by the databroker."
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: { type: string }
              message: { type: string }
    Diagnostics:
      description: Request understood but rejected; see diagnostics (ADR-0016).
      content:
        application/json:
          schema: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1#/$defs/list" }
  schemas:
    Sandbox:
      type: string
      pattern: "^(toolchain-(cpp|python|rust)|vehicle-gateway):[0-9]{2,5}$"
      description: "`toolchain-<lang>:<port>` on sv-internal; nothing else is accepted (no other internal address). PUT /mirror with `sandbox` and no paths releases it (the run ended)."
    Playback:
      type: object
      required: [id, release, name, state, until, played, total, startedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        release: { type: string }
        name: { type: string }
        state: { enum: [playing, done, stopped, failed] }
        until: { type: integer, minimum: 0, description: "Scenario length (ms)." }
        played: { type: integer, minimum: 0, description: "Inputs applied so far." }
        total: { type: integer, minimum: 0 }
        startedAt: { type: integer }
        error: { type: string }
        observed:
          type: array
          description: "Changes of the observed signals during the playback, ms from its start; the playback's own values are left out."
          items:
            type: object
            required: [t, path, field, value]
            properties:
              t: { type: integer, minimum: 0 }
              path: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/vssPath" }
              field: { enum: [value, target] }
              value: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/jsonValue" }
