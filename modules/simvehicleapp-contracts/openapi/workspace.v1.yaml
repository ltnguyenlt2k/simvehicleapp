openapi: 3.1.0
info:
  title: SimVehicleApp Workspace API
  version: 1.0.0-alpha.1
  description: "Single writer of /workspace/projects/** (ADR-0026). Validates every path, writes via staging + atomic swap with journal."
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://workspace:4040
    description: Compose internal network (not published to the host).
security:
  - internal: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [service]
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1#/$defs/health" }
  /version:
    get:
      operationId: version
      tags: [service]
      security: []
      responses:
        "200":
          description: Name, version, commit and contracts version (ADR-0007 §7).
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1" }
  /projects:
    post:
      operationId: initProject
      tags: [projects]
      description: Init from toolchain template + backend overlay + runtime files, staged then renamed atomically.
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, language, appName, vssRelease]
              additionalProperties: false
              properties:
                slug: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/slug" }
                language: { enum: [cpp, python, rust] }
                appName: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
                vssRelease: { type: string, pattern: "^v[0-9]+\\.[0-9]+(-[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)?$" }
      responses:
        "201": { description: "Project created." }
        "409": { description: "Slug already exists." }
        "422": { $ref: "#/components/responses/Diagnostics" }
  /projects/{slug}:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Remove the project folder, its generation records and backups (ADR-0053). Idempotent.
      description: >-
        Serialized with commits of the same project (never deletes in the middle of one). Other projects are never
        touched. A project that does not exist answers 204 as well.
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "204": { description: "Deleted (or already absent)." }
        "422": { $ref: "#/components/responses/Diagnostics" }
  /projects/{slug}/clean:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      operationId: cleanProject
      tags: [projects]
      summary: Remove the build outputs of the project (build*/, target/, caches), keep its sources (ADR-0053).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Bytes freed.
          content:
            application/json:
              schema: { type: object, required: [freedBytes], properties: { freedBytes: { type: integer, minimum: 0 } } }
        "404": { description: "No such project." }
  /projects/{slug}/size:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: getProjectSize
      tags: [projects]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Disk usage of the project folder (sources + build outputs).
          content:
            application/json:
              schema:
                type: object
                required: [bytes, buildBytes]
                properties:
                  bytes: { type: integer, minimum: 0 }
                  buildBytes: { type: integer, minimum: 0, description: "Part that `clean` would free." }
        "404": { description: "No such project." }
  /capacity:
    get:
      operationId: getCapacity
      tags: [projects]
      summary: Free space of the projects volume and the threshold level reached (ADR-0053 §4).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Capacity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capacity" }
  /projects/{slug}/commits:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      operationId: commitGeneration
      tags: [generations]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generationId, fileset]
              additionalProperties: false
              properties:
                generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
                fileset: { $ref: "urn:simvehicleapp:contracts:generated-fileset:1.0.0-alpha.1" }
                overwriteModified: { type: boolean, default: false, description: "Proceed when owned files were edited (backup kept in .sv/backup)." }
      responses:
        "200":
          description: Committed; workspace generation record.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:generation-manifest:1.0.0-alpha.1" }
        "409":
          description: Owned files modified outside SimVehicleApp (GENERATED_FILE_MODIFIED); resend with overwriteModified.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1#/$defs/list" }
        "422": { $ref: "#/components/responses/Diagnostics" }
  /projects/{slug}/tree:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: getTree
      tags: [projects]
      description: Read-only listing for the UI.
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Files of the project (excluding build outputs).
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, size]
                      properties:
                        path: { $ref: "urn:simvehicleapp:contracts:generated-fileset:1.0.0-alpha.1#/$defs/filePath" }
                        size: { type: integer, minimum: 0 }
                        owned: { type: boolean, description: "Inside an owned root (generated)." }
  /projects/{slug}/file:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: readFile
      tags: [projects]
      description: "One text file of the project for the read-only viewer (≤ 1 MB; additive 2026-10-07, M07-T19)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: path, in: query, required: true, schema: { $ref: "urn:simvehicleapp:contracts:generated-fileset:1.0.0-alpha.1#/$defs/filePath" } }
      responses:
        "200":
          description: File content.
          content:
            application/json:
              schema: { type: object, required: [path, content], properties: { path: { type: string }, content: { type: string } } }
        "404": { description: "No such file (or the path is rejected)." }
  /projects/{slug}/generations:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      operationId: listGenerations
      tags: [generations]
      description: "Current generation and the retained ones, oldest first (additive 2026-10-07, M07-T19)."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Generations.
          content:
            application/json:
              schema:
                type: object
                required: [current, generations]
                properties:
                  current: { type: [string, "null"] }
                  generations: { type: array, items: { type: string } }
  /projects/{slug}/generations/{gid}/file:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { name: gid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    get:
      operationId: readGenerationFile
      tags: [generations]
      description: "A file as a retained generation wrote it (diff with the previous generation; additive 2026-10-07, M07-T19)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: path, in: query, required: true, schema: { $ref: "urn:simvehicleapp:contracts:generated-fileset:1.0.0-alpha.1#/$defs/filePath" } }
      responses:
        "200":
          description: File content in that generation.
          content:
            application/json:
              schema: { type: object, required: [path, content], properties: { path: { type: string }, content: { type: string } } }
        "404": { description: "Generation not retained or file not in it." }
  /projects/{slug}/export:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      operationId: exportProject
      tags: [export]
      description: "Deterministic zip of the project folder (no build outputs, VCS, caches, symlinks; honors .svexportignore) plus the orchestrator's extra files (ADR-0031 §1). Entitlement is checked by the orchestrator before calling."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id", description: "Must be the generation the folder holds (409 otherwise)." }
                extraFiles:
                  type: array
                  maxItems: 500
                  description: "Added to the zip: paths under `.simvehicleapp/`, or README.SIMVEHICLE.md, NOTICE, THIRD-PARTY-NOTICES."
                  items: { type: object, required: [path, content], properties: { path: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/relativePath" }, content: { type: string } } }
      responses:
        "200":
          description: Project zip.
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
  /projects/{slug}/rollback:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      operationId: rollback
      tags: [generations]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generationId]
              properties:
                generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
      responses:
        "200":
          description: Re-committed file set of that generation.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:generation-manifest:1.0.0-alpha.1" }
        "404": { description: "Generation not retained (last 10 are kept)." }
  /projects/{slug}/vss-sync:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      operationId: syncProjectVss
      tags: [projects]
      summary: Make the project's VSS file equal to its release in vss-catalog (ADR-0052, before each SynCode build).
      description: >-
        A custom model (`vX.Y-<name>`) may gain signals after the project was created; the file named by the
        AppManifest vehicle-signal-interface is rewritten atomically when the catalog's document differs (compared as
        JSON, formatting ignored), so the toolchain regenerates the vehicle model. A remote `src` is left alone.
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema:
                type: object
                required: [release, path, changed]
                properties:
                  release: { type: string }
                  path: { type: [string, "null"], description: "Project-relative VSS file; null when the AppManifest names a remote source." }
                  changed: { type: boolean }
        "404": { description: "No such project." }
        "422": { $ref: "#/components/responses/Diagnostics" }
        "502": { description: "vss-catalog failed (diagnostics, WORKSPACE_COMMIT_FAILED)." }
components:
  securitySchemes:
    internal:
      type: apiKey
      in: header
      name: x-sv-internal
      description: INTERNAL_API_SECRET shared by internal services (ADR-0007 §5). Only the studio BFF faces the browser.
  parameters:
    RequestId:
      name: x-sv-request-id
      in: header
      required: false
      description: Correlation id propagated across services (ADR-0007 §6).
      schema: { type: string, maxLength: 128 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/slug" }
  responses:
    Diagnostics:
      description: Request understood but rejected; the body is the array of diagnostics (ADR-0016) — what the services return since M07 (corrected 2026-10-14, it was documented as `{diagnostics}`).
      content:
        application/json:
          schema: { type: array, items: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1" } }
  schemas:
    Capacity:
      type: object
      required: [freeBytes, totalBytes, level, thresholds]
      properties:
        freeBytes: { type: integer, minimum: 0 }
        totalBytes: { type: integer, minimum: 0 }
        level: { enum: [ok, low, high, flood], description: "low = warn; high = no new app; flood = no SynCode." }
        thresholds:
          type: object
          required: [lowBytes, highBytes, floodBytes]
          properties:
            lowBytes: { type: integer, minimum: 0 }
            highBytes: { type: integer, minimum: 0 }
            floodBytes: { type: integer, minimum: 0 }
