openapi: 3.1.0
info:
  title: SimVehicleApp Orchestrator API
  version: 1.0.0-alpha.1
  description: "Projects, SynCode generations, runs and the event stream (ADR-0020, ADR-0026, ADR-0027). Data owner of schema `sv`. Project and Generation bodies locked in M7 (2026-10-07); runs locked in M8."
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://orchestrator:4030
    description: Compose internal network (not published to the host).
security:
  - internal: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [service]
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1#/$defs/health" }
  /version:
    get:
      operationId: version
      tags: [service]
      security: []
      responses:
        "200":
          description: Name, version, commit and contracts version (ADR-0007 §7).
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      tags: [projects]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, language, vssRelease]
              properties:
                slug: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/slug" }
                name: { type: string, minLength: 1, maxLength: 200 }
                language: { enum: [cpp, python, rust] }
                vssRelease: { type: string, pattern: "^v[0-9]+\\.[0-9]+$" }
                appName: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$", description: "Default: PascalCase of the name." }
                settings: { $ref: "#/components/schemas/ProjectSettings" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: "Denied by EntitlementService (LICENSE_FEATURE_DENIED)." }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProject
      tags: [projects]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { description: "Unknown project." }
  /projects/{id}/workflows:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    put:
      operationId: setProjectWorkflows
      description: "Workflows (studio ids) SynCode generates into the project (M07-T17)."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflows]
              properties:
                workflows:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [simWorkflowId]
                    properties:
                      simWorkflowId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
                      enabled: { type: boolean, default: true }
      responses:
        "200":
          description: Project with its workflows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}/files:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProjectFiles
      description: "Tree of the project folder and its retained generations (workspace, read-only; M07-T19)."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Files and generations.
          content:
            application/json:
              schema:
                type: object
                required: [files, current, generations]
                properties:
                  files: { type: array, items: { type: object, required: [path, size], properties: { path: { type: string }, size: { type: integer }, owned: { type: boolean } } } }
                  current: { type: [string, "null"] }
                  generations: { type: array, items: { type: string } }
  /projects/{id}/file:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProjectFile
      description: "One file of the project, or as a retained generation wrote it (`generationId`, diff view; M07-T19)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 1024 } }
        - { name: generationId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
      responses:
        "200":
          description: File content.
          content:
            application/json:
              schema: { type: object, required: [path, content], properties: { path: { type: string }, content: { type: string } } }
        "404": { description: "No such file or generation." }
  /projects/{id}/generations:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: startGeneration
      tags: [generations]
      description: "SynCode pipeline: ir → codegen → write → deps? → build → format-check → test. Progress on /events."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graphs]
              properties:
                graphs: { type: array, minItems: 1, maxItems: 100, items: { $ref: "urn:simvehicleapp:contracts:workflow-graph:1.0.0-alpha.1" }, description: "Workflow graphs exported by the studio adapter." }
                scenarios:
                  description: "Scenario per workflow for the generated tests (M7)."
                  type: array
                  items:
                    type: object
                    required: [workflowId, scenario]
                    properties:
                      workflowId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
                      scenario: { $ref: "urn:simvehicleapp:contracts:scenario:1.0.0-alpha.1" }
                overwriteModified: { type: boolean, default: false, description: "Overwrite generated files edited by hand (backed up by the workspace)." }
      responses:
        "202":
          description: Generation queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
        "422": { $ref: "#/components/responses/Diagnostics" }
  /projects/{id}/generations/{gid}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: gid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    get:
      operationId: getGeneration
      tags: [generations]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
  /projects/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: startRun
      tags: [runs]
      description: "Runs the app a succeeded generation built (toolchain `run` job) against the databroker of the project's VSS release (ADR-0024 §6). One run at a time on the shared runtime stack."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id", description: "Default: the project's latest generation (it must have succeeded)." }
                traceLevel: { enum: ["off", trigger, node], description: "Lowers the project's trace level for this run (SV_TRACE_LEVEL; never raises it)." }
      responses:
        "202":
          description: Run starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: "Unknown project or generation." }
        "409":
          description: "Another run is active (one shared runtime stack, ADR-0024 §6), or the generation did not succeed / is not the project's current one."
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error: { type: string }
                  message: { type: string }
                  activeRun: { $ref: "#/components/schemas/Run" }
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      description: "Most recent runs first (at most 20)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: projectId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
        - { name: active, in: query, required: false, schema: { type: boolean }, description: "Only the run that is starting, running or stopping." }
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
  /runs/{rid}:
    parameters:
      - { name: rid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    get:
      operationId: getRun
      tags: [runs]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: "Unknown run." }
  /runs/{rid}/stop:
    parameters:
      - { name: rid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    post:
      operationId: stopRun
      tags: [runs]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Stop requested (SIGINT, SIGKILL after 5 s); a finished run is returned unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: "Unknown run." }
  /events:
    get:
      operationId: streamEvents
      tags: [runs]
      description: "SSE of TraceEvent v1 (`event: trace`) and LogLine v1 (`event: log`) for a run or generation; `id` = seq, resume with Last-Event-ID."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: runId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
        - { name: generationId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
              x-sv-event-data:
                oneOf:
                  - { $ref: "urn:simvehicleapp:contracts:trace-event:1.0.0-alpha.1" }
                  - { $ref: "urn:simvehicleapp:contracts:log-line:1.0.0-alpha.1" }
components:
  securitySchemes:
    internal:
      type: apiKey
      in: header
      name: x-sv-internal
      description: INTERNAL_API_SECRET shared by internal services (ADR-0007 §5). Only the studio BFF faces the browser.
  parameters:
    RequestId:
      name: x-sv-request-id
      in: header
      required: false
      description: Correlation id propagated across services (ADR-0007 §6).
      schema: { type: string, maxLength: 128 }
    ProjectId:
      name: id
      in: path
      required: true
      schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
  responses:
    Diagnostics:
      description: Request understood but rejected; see diagnostics (ADR-0016).
      content:
        application/json:
          schema: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1#/$defs/list" }
  schemas:
    ProjectSettings:
      type: object
      properties:
        mqttTopicPrefix: { type: string, pattern: "^[^#+]+$", description: "Default simvehicleapp/<slug>." }
        traceLevel: { enum: [off, trigger, node], default: node }
    Project:
      type: object
      required: [id, slug, name, appName, language, vssRelease, settings, status, workflows]
      properties:
        id: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        slug: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/slug" }
        name: { type: string }
        appName: { type: string }
        language: { enum: [cpp, python, rust] }
        vssRelease: { type: string }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        status: { enum: [creating, ready, failed], description: "creating until the workspace and the toolchain prepared the folder." }
        statusMessage: { type: string }
        workflows: { type: array, items: { type: object, required: [simWorkflowId, enabled], properties: { simWorkflowId: { type: string }, enabled: { type: boolean } } } }
    Verdict: { enum: [passed, failed, skipped, pending] }
    Generation:
      description: "Master Plan Appendix A (success) / Appendix B (failure: success false, stage, diagnostics)."
      type: object
      required: [id, generationId, projectId, state, stages, verification, diagnostics, generatedFiles, workflows, createdAt]
      properties:
        id: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        projectId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        state: { enum: [queued, running, succeeded, failed, cancelled] }
        success: { type: boolean, description: "Present once the generation ended." }
        stage: { enum: [ir, codegen, write, deps, build, format-check, test], description: "Running stage, or the failing one." }
        stages:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: { enum: [ir, codegen, write, deps, build, format-check, test] }
              state: { enum: [pending, running, passed, failed, skipped] }
              startedAt: { type: integer }
              finishedAt: { type: integer }
        verification:
          type: object
          required: [ir, format, compile, tests]
          properties:
            ir: { $ref: "#/components/schemas/Verdict" }
            format: { $ref: "#/components/schemas/Verdict" }
            compile: { $ref: "#/components/schemas/Verdict" }
            tests: { $ref: "#/components/schemas/Verdict" }
        diagnostics: { type: array, items: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1" } }
        generatedFiles: { type: array, items: { type: string } }
        workflows: { type: array, items: { type: object, required: [workflowId, revision, irHash], properties: { workflowId: { type: string }, revision: { type: integer }, irHash: { type: string } } } }
        workflowRevision: { type: integer }
        modelHash: { type: string }
        compilerVersion: { type: string }
        backend: { type: string }
        editor: { type: object, required: [url], properties: { url: { type: string } } }
        createdAt: { type: integer }
        finishedAt: { type: integer }
    Run:
      type: object
      description: "A live run (analysis/08 §5): starting until the app traces `app.started` (30 s, else RUN_START_TIMEOUT), stopped after Stop, crashed when the app exits on its own or never starts."
      required: [id, projectId, generationId, state, vssRelease, traceLevel, diagnostics, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        projectId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        state: { enum: [starting, running, stopping, stopped, crashed] }
        vssRelease: { type: string, pattern: "^v[0-9]+\\.[0-9]+$" }
        traceLevel: { enum: ["off", trigger, node] }
        exitCode: { type: integer }
        diagnostics: { type: array, items: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1" } }
        createdAt: { type: integer }
        runningAt: { type: integer, description: "When `app.started` arrived." }
        finishedAt: { type: integer }
