openapi: 3.1.0
info:
  title: SimVehicleApp Orchestrator API
  version: 1.0.0-alpha.1
  description: "Projects, SynCode generations, runs and the event stream (ADR-0020, ADR-0026, ADR-0027). Data owner of schema `sv`. Project and Generation bodies locked in M7 (2026-10-07); runs locked in M8."
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://orchestrator:4030
    description: Compose internal network (not published to the host).
security:
  - internal: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [service]
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1#/$defs/health" }
  /version:
    get:
      operationId: version
      tags: [service]
      security: []
      responses:
        "200":
          description: Name, version, commit and contracts version (ADR-0007 §7).
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      tags: [projects]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, language, vssRelease]
              properties:
                slug: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/slug" }
                name: { type: string, minLength: 1, maxLength: 200 }
                language: { enum: [cpp, python, rust] }
                target: { enum: [velocitas, wasm], default: velocitas, description: "What the app runs on (ADR-0061): a native Velocitas app, or a WebAssembly guest run by sv-wasm-host (C++ and Rust)." }
                vssRelease: { type: string, pattern: "^v[0-9]+\\.[0-9]+(-[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)?$" }
                appName: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$", description: "Default: PascalCase of the name." }
                settings: { $ref: "#/components/schemas/ProjectSettings" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: "Denied by EntitlementService (LICENSE_FEATURE_DENIED)." }
        "409": { description: "The slug exists, or the host app quota is reached (diagnostics `APP_QUOTA_EXCEEDED`, `data.scope` = host; ADR-0053)." }
        "507": { description: "Free disk below the high threshold: no new app (diagnostics `HOST_DISK_LOW`, `data.level`, `data.freeBytes`; ADR-0053)." }
        "422": { description: "No backend serves this language and target (diagnostics `BACKEND_UNAVAILABLE`, `data.language`, `data.target`; ADR-0061)." }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProject
      tags: [projects]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { description: "Unknown project." }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete the app — stops its run, removes its folder, toolchain cache and records (ADR-0053). Idempotent.
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "204": { description: "Deleted (or already absent)." }
        "409": { description: "A SynCode of the app is queued or running: wait for it or cancel it first." }
  /projects/{id}/repair:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: repairProject
      tags: [projects]
      summary: Re-create a failed app from scratch, keeping its workflows and settings (ADR-0053).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "202":
          description: Repair started; the app is `creating` again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { description: "Unknown project." }
        "409": { description: "Only a `failed` app can be repaired." }
        "507": { description: "Free disk below the high threshold (`HOST_DISK_LOW`)." }
  /projects/{id}/size:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProjectSize
      tags: [projects]
      summary: Disk usage of the app folder and the part `clean` would free (relays the workspace, ADR-0053).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Size.
          content:
            application/json:
              schema: { type: object, required: [bytes, buildBytes], properties: { bytes: { type: integer, minimum: 0 }, buildBytes: { type: integer, minimum: 0 } } }
        "404": { description: "Unknown project (or its folder is gone)." }
  /projects/{id}/clean:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: cleanProject
      tags: [projects]
      summary: Remove the app's build outputs, keep its sources; the next build starts from scratch (ADR-0053).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Bytes freed.
          content:
            application/json:
              schema: { type: object, required: [freedBytes], properties: { freedBytes: { type: integer, minimum: 0 } } }
        "404": { description: "Unknown project." }
        "409": { description: "A SynCode or a run of the app is active." }
  /capacity:
    get:
      operationId: getCapacity
      tags: [system]
      summary: Host capacity for the studio (System status, Vehicle apps) — disk level, apps and SynCode queue (ADR-0053).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Capacity.
          content:
            application/json:
              schema:
                type: object
                required: [disk, apps, queue]
                properties:
                  disk: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/jsonValue", description: "workspace `Capacity` (freeBytes, totalBytes, level, thresholds); null when the workspace cannot be reached." }
                  apps: { type: object, required: [total, limit], properties: { total: { type: integer, minimum: 0 }, limit: { type: integer, minimum: 0 } } }
                  queue: { type: object, required: [queued, limit], properties: { queued: { type: integer, minimum: 0 }, limit: { type: integer, minimum: 0 } } }
                  runs:
                    type: object
                    description: "Vehicle runtime (ADR-0057): apps running now against the host's run quota."
                    required: [active, limit, perUser, sandbox, maxMinutes]
                    properties:
                      active: { type: integer, minimum: 0 }
                      limit: { type: integer, minimum: 0 }
                      perUser: { type: integer, minimum: 0 }
                      sandbox: { type: boolean }
                      maxMinutes: { type: number, minimum: 0 }
  /sweep:
    post:
      operationId: sweep
      tags: [system]
      summary: Runs the sweeper now (ADR-0053 §6) — the hourly job that deletes old failed apps, cleans idle apps and drops orphan toolchain caches. For operators and gates.
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: What the sweep did.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, cleaned, skipped, freedBytes, cachesRemoved, errors]
                properties:
                  deleted: { type: array, items: { type: string }, description: "slugs of the apps deleted" }
                  cleaned: { type: array, items: { type: string }, description: "slugs of the apps whose build outputs were removed" }
                  skipped: { type: array, items: { type: string }, description: "slugs left alone because they run or have a SynCode queued/building" }
                  freedBytes: { type: integer, minimum: 0 }
                  cachesRemoved: { type: integer, minimum: 0 }
                  errors: { type: array, items: { type: string } }
        "409": { description: "A sweep is already running." }
        "503": { description: "The sweeper is not configured." }
  /projects/{id}/workflows:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    put:
      operationId: setProjectWorkflows
      description: "Workflows (studio ids) SynCode generates into the project (M07-T17)."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflows]
              properties:
                workflows:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [simWorkflowId]
                    properties:
                      simWorkflowId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
                      enabled: { type: boolean, default: true }
      responses:
        "200":
          description: Project with its workflows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { description: "More enabled workflows than the per-app limit (`APP_QUOTA_EXCEEDED`, `data.scope` = app; ADR-0053)." }
  /projects/{id}/files:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProjectFiles
      description: "Tree of the project folder and its retained generations (workspace, read-only; M07-T19)."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Files and generations.
          content:
            application/json:
              schema:
                type: object
                required: [files, current, generations]
                properties:
                  files: { type: array, items: { type: object, required: [path, size], properties: { path: { type: string }, size: { type: integer }, owned: { type: boolean } } } }
                  current: { type: [string, "null"] }
                  generations: { type: array, items: { type: string } }
  /projects/{id}/file:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProjectFile
      description: "One file of the project, or as a retained generation wrote it (`generationId`, diff view; M07-T19)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 1024 } }
        - { name: generationId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
      responses:
        "200":
          description: File content.
          content:
            application/json:
              schema: { type: object, required: [path, content], properties: { path: { type: string }, content: { type: string } } }
        "404": { description: "No such file or generation." }
  /projects/{id}/generations:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: startGeneration
      tags: [generations]
      description: "SynCode pipeline: ir → codegen → write → deps? → build → format-check → test. Progress on /events."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf: [{ required: [graphs] }, { required: [fromGeneration] }]
              properties:
                graphs: { type: array, minItems: 1, maxItems: 100, items: { $ref: "urn:simvehicleapp:contracts:workflow-graph:1.0.0-alpha.1" }, description: "Workflow graphs exported by the studio adapter." }
                fromGeneration: { enum: [latest], description: "Without graphs: SynCode again with the graphs (and scenarios) of the project's last SynCode — for callers without the studio (MCP agents)." }
                scenarios:
                  description: "Test cases of the workflows for the generated tests (M7; several per workflow with caseName, ADR-0058 §2)."
                  type: array
                  items:
                    type: object
                    required: [workflowId, scenario]
                    properties:
                      workflowId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
                      scenario: { $ref: "urn:simvehicleapp:contracts:scenario:1.0.0-alpha.1" }
                      caseName: { type: string, minLength: 1, maxLength: 80 }
                overwriteModified: { type: boolean, default: false, description: "Overwrite generated files edited by hand (backed up by the workspace)." }
      responses:
        "202":
          description: Generation queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
        "409": { description: "`no_previous_generation`: fromGeneration without an earlier SynCode; `not_ready`: the app is still being created or failed (repair it)." }
        "422": { $ref: "#/components/responses/Diagnostics" }
        "429": { description: "SynCode queue full (`SYNCODE_QUEUE_FULL`, ADR-0053). A newer request of the same app replaces its queued one instead." }
        "507": { description: "Free disk below the flood threshold: no SynCode (`HOST_DISK_LOW`)." }
  /projects/{id}/graphs:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProjectGraphs
      tags: [generations]
      description: "The WorkflowGraphs of the project's last SynCode (what its app was generated from)."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Graphs of the last generation.
          content:
            application/json:
              schema:
                type: object
                required: [generationId, graphs]
                properties:
                  generationId: { type: string }
                  graphs: { type: array, items: { $ref: "urn:simvehicleapp:contracts:workflow-graph:1.0.0-alpha.1" } }
        "404": { description: "No SynCode yet." }
  /projects/{id}/generations/{gid}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: gid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    get:
      operationId: getGeneration
      tags: [generations]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
  /projects/{id}/export:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: exportProject
      tags: [export]
      description: "Zip of the project (ADR-0031 §1, M09-T06): the folder as the workspace exports it, plus `.simvehicleapp/workflows/*.graph.json` (re-importable), `.simvehicleapp/generation.json`, `.simvehicleapp/license.json`, README.SIMVEHICLE.md, NOTICE, THIRD-PARTY-NOTICES. Entitlement `export.source`."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Project zip.
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
        "403": { description: "not_entitled (export.source)." }
        "409": { description: "SynCode is changing the project." }
  /projects/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: startRun
      tags: [runs]
      description: "Runs the app a succeeded generation built (toolchain `run` job) against the databroker of the project's VSS release (ADR-0024 §6). One run at a time on the shared runtime stack — or, with `SV_RUN_SANDBOX=1` (ADR-0057), every run on a databroker of its own, within quotas per user and per host, one run per app."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id", description: "Default: the project's latest generation (it must have succeeded)." }
                traceLevel: { enum: ["off", trigger, node], description: "Lowers the project's trace level for this run (SV_TRACE_LEVEL; never raises it)." }
                owner: { $ref: "#/components/schemas/RunOwner" }
      responses:
        "202":
          description: Run starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: "Unknown project or generation." }
        "409":
          description: "Another run is active (one shared runtime stack, ADR-0024 §6) or this app already runs, or the generation did not succeed / is not the project's current one; with sandboxes, a quota is reached: a diagnostics array with RUN_QUOTA_EXCEEDED (`data.scope` user|host, `data.limit`, `data.runs` = the caller's runs holding the quota)."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [error, message]
                    properties:
                      error: { type: string }
                      message: { type: string }
                      activeRun: { $ref: "#/components/schemas/Run" }
                  - { type: array, items: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1" } }
  /system:
    get:
      operationId: getSystemStatus
      tags: [service]
      description: "Health and version of every service the orchestrator drives (System status page, ADR-0033 §4)."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: One entry per service (compiler, workspace, signal-gateway, codegen-<lang>, toolchain-<lang>).
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required: [service, status]
                      properties:
                        service: { type: string }
                        status: { enum: [ok, degraded, down] }
                        version: { type: string }
                        commit: { type: string }
                        contracts: { type: string }
                        latencyMs: { type: integer, minimum: 0 }
                        error: { type: string }
  /entitlements:
    get:
      operationId: getEntitlements
      tags: [license]
      description: "License status of the EntitlementService (ADR-0031 §2–3): mode, edition, features, limits — what clients may show; decisions are made per action."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: License status.
          content:
            application/json:
              schema:
                type: object
                required: [mode, licensed]
                properties:
                  mode: { enum: [full, enforce] }
                  licensed: { type: boolean }
                  reason: { type: string }
                  edition: { type: string }
                  licensee: { type: string }
                  expiry: { type: [string, "null"] }
                  features: { $ref: "urn:simvehicleapp:contracts:license:1.0.0-alpha.1#/properties/features" }
                  limits: { $ref: "urn:simvehicleapp:contracts:license:1.0.0-alpha.1#/properties/limits" }
  /entitlements/{feature}:
    get:
      operationId: checkEntitlement
      tags: [license]
      description: "PDP decision (logged) for a feature another service gates — the ai-assistant asks for `ai.assistant` before each turn (ADR-0031 §2, ADR-0030 Notes 2026-10-07)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: feature, in: path, required: true, schema: { enum: [ai.assistant] } }
      responses:
        "200":
          description: Decision; `allowed` false ⇒ the caller answers 403 `not_entitled` with `reason`.
          content:
            application/json:
              schema:
                type: object
                required: [feature, allowed, licensed, mode, reason]
                properties:
                  feature: { type: string }
                  allowed: { type: boolean }
                  licensed: { type: boolean }
                  mode: { enum: [full, enforce] }
                  reason: { type: string }
        "404": { description: Not a feature decided for other services. }
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      description: "Most recent runs first (at most 20)."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: projectId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
        - { name: active, in: query, required: false, schema: { type: boolean }, description: "Only runs that are starting, running or stopping." }
        - { name: ownerUserId, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }, description: "Only runs this user started (My runs, ADR-0057)." }
      responses:
        "200":
          description: "Runs, and the run limits in force (`sandbox` false: one run at a time on the shared stack, no expiry)."
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  limits:
                    type: object
                    required: [sandbox, perUser, total, maxMinutes, maxExtensions]
                    properties:
                      sandbox: { type: boolean }
                      perUser: { type: integer, minimum: 1 }
                      total: { type: integer, minimum: 1 }
                      maxMinutes: { type: number, minimum: 0 }
                      maxExtensions: { type: integer, minimum: 0 }
  /runs/{rid}:
    parameters:
      - { name: rid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    get:
      operationId: getRun
      tags: [runs]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: "Unknown run." }
  /runs/{rid}/stop:
    parameters:
      - { name: rid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    post:
      operationId: stopRun
      tags: [runs]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { enum: [user, admin], description: "`admin` from `scripts/sv runs stop` (Run.stopReason, ADR-0057); default user." }
      responses:
        "200":
          description: Stop requested (SIGINT, SIGKILL after 5 s); a finished run is returned unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: "Unknown run." }
  /runs/{rid}/extend:
    parameters:
      - { name: rid, in: path, required: true, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
    post:
      operationId: extendRun
      tags: [runs]
      description: "Keeps a running app `SV_RUN_MAX_MINUTES` longer (ADR-0057), at most `SV_RUN_MAX_EXTENSIONS` times."
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Run with its new `expiresAt`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: "Unknown run." }
        "409": { description: "The run is not running, has no time limit, or was extended enough." }
  /deploy-targets:
    get:
      operationId: listDeployTargets
      tags: [deploy]
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The workspace's deploy targets.
          content:
            application/json:
              schema: { type: object, required: [targets], additionalProperties: false, properties: { targets: { type: array, items: { $ref: "#/components/schemas/DeployTarget" } } } }
    post:
      operationId: createDeployTarget
      tags: [deploy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, name, address, vssRelease]
              additionalProperties: false
              properties:
                workspaceId: { type: string }
                name: { type: string, minLength: 1, maxLength: 80 }
                address: { type: string, pattern: "^[A-Za-z0-9.-]{1,253}:[0-9]{2,5}$" }
                tls: { type: boolean }
                token: { type: string, maxLength: 4096 }
                vssRelease: { type: string }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/DeployTarget" } } } }
        "400": { description: Invalid request. }
        "409": { description: A target of that name exists in the workspace. }
  /deploy-targets/{tid}:
    delete:
      operationId: deleteDeployTarget
      tags: [deploy]
      parameters:
        - { name: tid, in: path, required: true, schema: { type: string } }
        - { name: workspaceId, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "404": { description: No such target in the workspace. }
        "409": { description: The target has active deployments. }
  /deploy-targets/{tid}/test:
    post:
      operationId: testDeployTarget
      tags: [deploy]
      description: "Test connection through the vehicle-gateway (`POST /probe`): the server, and the paths the app uses that the target lacks."
      parameters:
        - { name: tid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              additionalProperties: false
              properties:
                workspaceId: { type: string }
                paths: { type: array, maxItems: 200, items: { type: string } }
      responses:
        "200": { description: "vehicle-gateway probe result (reachable, server, missing) or why it is not reachable." }
        "404": { description: No such target in the workspace. }
  /projects/{id}/deployments:
    post:
      operationId: startDeployment
      tags: [deploy]
      description: "Deploys the app's latest SynCode to a target (ADR-0060): a Run with `deploy`; its signals come from the target; read-write lets it set its own actuators only."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, mode, owner]
              additionalProperties: false
              properties:
                targetId: { type: string }
                mode: { enum: [read-only, read-write] }
                generationId: { type: string }
                owner: { $ref: "#/components/schemas/RunOwner" }
      responses:
        "202": { description: The deployment (a Run with `deploy`)., content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { description: Unknown project or deploy target of the workspace. }
        "409": { description: "Already deployed, the target serves another VSS release, no generation, or `DEPLOY_QUOTA_EXCEEDED` (a diagnostics array)." }
  /projects/{id}/images:
    post:
      operationId: pushImage
      tags: [deploy]
      description: "Deploy as a container image (ADR-0060, M18-T10): the toolchain packs the app (binary, its shared libraries, AppManifest, notices) as an OCI image FROM scratch and pushes it to the registry without a Docker daemon. Synchronous: answers when the image is pushed."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              additionalProperties: false
              properties:
                reference: { type: string, description: "registry/repository[:tag]" }
                insecure: { type: boolean, description: "http registry (a lab registry)." }
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Pushed.
          content:
            application/json:
              schema:
                type: object
                required: [reference, digest, bytes, files, generationId]
                additionalProperties: false
                properties:
                  reference: { type: string }
                  digest: { type: string, pattern: "^sha256:[0-9a-f]+$" }
                  bytes: { type: integer }
                  files: { type: integer }
                  generationId: { type: string }
                  kanto:
                    type: object
                    description: "Eclipse Kanto container-management descriptor of the pushed image (M21 D14; kanto-cm v1.0.0 `types.Container` JSON, a file of its `deployment.ctr_dir`): the image by digest, host network, restart unless-stopped, the app's env pointed at the vehicle's databroker (kuksa.val.v2, 127.0.0.1:55555) and MQTT broker (127.0.0.1:1883). Deterministic for one image."
                    required: [container_name, image, host_config, config]
                    properties:
                      container_name: { type: string }
                      image: { type: object, required: [name], properties: { name: { type: string } } }
                      host_config: { type: object }
                      config: { type: object, properties: { env: { type: array, items: { type: string } } } }
        "400": { description: Invalid reference. }
        "409": { description: The app is not ready or its latest SynCode did not pass. }
        "422": { description: "`image_failed`: the build or the push failed (message, last log lines); Python apps are not supported yet." }
  /runs/{rid}/audit:
    get:
      operationId: deploymentAudit
      tags: [deploy]
      parameters:
        - { name: rid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The deployment route's audit (vehicle-gateway `GET /routes/{id}/audit`)." }
        "404": { description: Not a deployment. }
  /events:
    get:
      operationId: streamEvents
      tags: [runs]
      description: "SSE of TraceEvent v1 (`event: trace`) and LogLine v1 (`event: log`) for a run or generation; `id` = seq, resume with Last-Event-ID."
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { name: runId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
        - { name: generationId, in: query, required: false, schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
              x-sv-event-data:
                oneOf:
                  - { $ref: "urn:simvehicleapp:contracts:trace-event:1.0.0-alpha.1" }
                  - { $ref: "urn:simvehicleapp:contracts:log-line:1.0.0-alpha.1" }
components:
  securitySchemes:
    internal:
      type: apiKey
      in: header
      name: x-sv-internal
      description: INTERNAL_API_SECRET shared by internal services (ADR-0007 §5). Only the studio BFF faces the browser.
  parameters:
    RequestId:
      name: x-sv-request-id
      in: header
      required: false
      description: Correlation id propagated across services (ADR-0007 §6).
      schema: { type: string, maxLength: 128 }
    ProjectId:
      name: id
      in: path
      required: true
      schema: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
  responses:
    Diagnostics:
      description: Request understood but rejected; the body is the array of diagnostics (ADR-0016) — what the services return since M07 (corrected 2026-10-14, it was documented as `{diagnostics}`).
      content:
        application/json:
          schema: { type: array, items: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1" } }
  schemas:
    ProjectSettings:
      type: object
      properties:
        mqttTopicPrefix: { type: string, pattern: "^[^#+]+$", description: "Default simvehicleapp/<slug>." }
        traceLevel: { enum: [off, trigger, node], default: node }
    Project:
      type: object
      required: [id, slug, name, appName, language, vssRelease, settings, status, workflows]
      properties:
        id: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        slug: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/slug" }
        name: { type: string }
        appName: { type: string }
        language: { enum: [cpp, python, rust] }
        target: { enum: [velocitas, wasm], description: "What the app runs on (ADR-0061); older projects are velocitas." }
        vssRelease: { type: string }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        status: { enum: [creating, ready, failed], description: "creating until the workspace and the toolchain prepared the folder." }
        statusMessage: { type: string }
        workflows: { type: array, items: { type: object, required: [simWorkflowId, enabled], properties: { simWorkflowId: { type: string }, enabled: { type: boolean } } } }
        editor: { type: object, required: [url], properties: { url: { type: string } }, description: "code-server on the project folder (ADR-0028 §2), once the project is ready." }
        createdAt: { type: integer, description: "Epoch ms (additive, ADR-0053)." }
        updatedAt: { type: integer, description: "Epoch ms of the last status change (additive, ADR-0053)." }
    Verdict: { enum: [passed, failed, skipped, pending] }
    Generation:
      description: "Master Plan Appendix A (success) / Appendix B (failure: success false, stage, diagnostics)."
      type: object
      required: [id, generationId, projectId, state, stages, verification, diagnostics, generatedFiles, workflows, createdAt]
      properties:
        id: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        projectId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        state: { enum: [queued, running, succeeded, failed, cancelled] }
        success: { type: boolean, description: "Present once the generation ended." }
        stage: { enum: [ir, codegen, write, deps, build, format-check, test], description: "Running stage, or the failing one." }
        stages:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: { enum: [ir, codegen, write, deps, build, format-check, test] }
              state: { enum: [pending, running, passed, failed, skipped] }
              startedAt: { type: integer }
              finishedAt: { type: integer }
        verification:
          type: object
          required: [ir, format, compile, tests]
          properties:
            ir: { $ref: "#/components/schemas/Verdict" }
            format: { $ref: "#/components/schemas/Verdict" }
            compile: { $ref: "#/components/schemas/Verdict" }
            tests: { $ref: "#/components/schemas/Verdict" }
        diagnostics: { type: array, items: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1" } }
        generatedFiles: { type: array, items: { type: string } }
        workflows: { type: array, items: { type: object, required: [workflowId, revision, irHash], properties: { workflowId: { type: string }, revision: { type: integer }, irHash: { type: string } } } }
        workflowRevision: { type: integer }
        modelHash: { type: string }
        compilerVersion: { type: string }
        backend: { type: string }
        editor: { type: object, required: [url], properties: { url: { type: string } } }
        createdAt: { type: integer }
        finishedAt: { type: integer }
    RunOwner:
      type: object
      description: "Who started the run (studio user and workspace; the assistant sends only the user): per-user quota and My runs (ADR-0057)."
      required: [userId]
      additionalProperties: false
      properties:
        userId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
        workspaceId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    DeployTarget:
      type: object
      description: "A databroker outside the stack a workspace deploys apps to (ADR-0060). The token is never returned: `hasToken` says whether one is stored (sealed at rest)."
      required: [id, workspaceId, name, address, tls, vssRelease, createdAt, hasToken]
      additionalProperties: false
      properties:
        id: { type: string }
        workspaceId: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, pattern: "^[A-Za-z0-9.-]{1,253}:[0-9]{2,5}$" }
        tls: { type: boolean }
        vssRelease: { type: string }
        createdAt: { type: integer }
        hasToken: { type: boolean }
    Run:
      type: object
      description: "A live run (analysis/08 §5): starting until the app traces `app.started` (30 s, else RUN_START_TIMEOUT), stopped after Stop, crashed when the app exits on its own or never starts."
      required: [id, projectId, generationId, state, vssRelease, traceLevel, diagnostics, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        projectId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        generationId: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/id" }
        state: { enum: [starting, running, stopping, stopped, crashed] }
        vssRelease: { type: string, pattern: "^v[0-9]+\\.[0-9]+(-[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)?$" }
        traceLevel: { enum: ["off", trigger, node] }
        exitCode: { type: integer }
        diagnostics: { type: array, items: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1" } }
        createdAt: { type: integer }
        runningAt: { type: integer, description: "When `app.started` arrived." }
        finishedAt: { type: integer }
        owner: { $ref: "#/components/schemas/RunOwner" }
        sandbox: { type: string, pattern: "^[a-z0-9-]+:[0-9]{2,5}$", description: "Address of the run's own databroker on sv-internal (ADR-0057); absent on the shared stack." }
        expiresAt: { type: integer, description: "When the run stops by itself (stopReason expired) unless extended." }
        extensions: { type: integer, minimum: 0 }
        stopReason: { enum: [user, expired, admin] }
        deploy:
          type: object
          description: "A deployment (ADR-0060): the app runs on the deploy target's signals through a vehicle-gateway route (`sandbox` = vehicle-gateway:<port>, read only for the signal-gateway); no expiry."
          required: [targetId, targetName, mode]
          additionalProperties: false
          properties:
            targetId: { type: string }
            targetName: { type: string }
            mode: { enum: [read-only, read-write] }
