openapi: 3.1.0
info:
  title: SimVehicleApp Backend Plugin API
  version: 1.0.0-alpha.1
  description: "Contract every compiler-code-<lang> backend implements (ADR-0020). Pure and deterministic; no network egress. Server URL shows the C++ backend; others differ only in host/port."
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://codegen-cpp:4110
    description: Compose internal network (not published to the host).
security:
  - internal: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [service]
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1#/$defs/health" }
  /version:
    get:
      operationId: version
      tags: [service]
      security: []
      responses:
        "200":
          description: Name, version, commit and contracts version (ADR-0007 §7).
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:service-info:1.0.0-alpha.1" }
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [backend]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: backend.yaml as JSON.
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:backend-capabilities:1.0.0-alpha.1" }
  /generate:
    post:
      operationId: generate
      tags: [backend]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "urn:simvehicleapp:contracts:generated-fileset:1.0.0-alpha.1#/$defs/generateRequest" }
      responses:
        "200":
          description: Generated file set (same request ⇒ same bytes).
          content:
            application/json:
              schema: { $ref: "urn:simvehicleapp:contracts:generated-fileset:1.0.0-alpha.1" }
        "422": { $ref: "#/components/responses/Diagnostics" }
  /runtime/files:
    get:
      operationId: getRuntimeFiles
      tags: [backend]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { $ref: "#/components/responses/FileBundle" }
  /template-overlay/files:
    get:
      operationId: getTemplateOverlayFiles
      tags: [backend]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { $ref: "#/components/responses/FileBundle" }
components:
  securitySchemes:
    internal:
      type: apiKey
      in: header
      name: x-sv-internal
      description: INTERNAL_API_SECRET shared by internal services (ADR-0007 §5). Only the studio BFF faces the browser.
  parameters:
    RequestId:
      name: x-sv-request-id
      in: header
      required: false
      description: Correlation id propagated across services (ADR-0007 §6).
      schema: { type: string, maxLength: 128 }
  responses:
    Diagnostics:
      description: Request understood but rejected; see diagnostics (ADR-0016).
      content:
        application/json:
          schema: { $ref: "urn:simvehicleapp:contracts:diagnostics:1.0.0-alpha.1#/$defs/list" }
    FileBundle:
      description: Files the workspace vendors into a project (runtime library or one-time template overlay).
      content:
        application/json:
          schema:
            type: object
            required: [runtimeVersion, files]
            properties:
              runtimeVersion: { $ref: "urn:simvehicleapp:contracts:common:1.0.0-alpha.1#/$defs/semver" }
              files: { type: array, items: { $ref: "urn:simvehicleapp:contracts:generated-fileset:1.0.0-alpha.1#/$defs/file" } }
