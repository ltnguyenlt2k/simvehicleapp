# The WebAssembly target of the C++ backend (ADR-0061, M20-T04): GET /wasm/capabilities is backend.yaml with these
# fields replaced. Same emitter and opcodes as the native target; the app is a wasm32-wasip1 guest of sv-wasm-host.
id: cpp-wasm
name: compiler-code-cpp
target:
  kind: wasm
  triple: wasm32-wasip1
  abi: sv-wasm-abi/1
  host: { name: sv-wasm-host, version: 0.1.0 }
toolchain:
  id: toolchain-wasm
  template: wasm-app-cpp
  templateSha: 10856ad58f67d87b233e9cd6768fc7b0b6eb0397  # git tree id of velocitas-stack/templates/wasm-app-cpp
