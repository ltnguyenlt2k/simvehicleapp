# simvehicleapp-orchestrator — self-contained compose fragment. Building it needs image simvehicleapp/contracts:dev
# (modules/simvehicleapp-contracts; `scripts/sv build` builds it first).
services:
  orchestrator:
    image: simvehicleapp/orchestrator:dev
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
      additional_contexts:
        contracts: docker-image://${SV_CONTRACTS_IMAGE:-simvehicleapp/contracts:dev}
    environment:
      SV_COMMIT: ${SV_COMMIT:-unknown}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env}
      # Data owner of schema `sv` in the stack's Postgres (ADR-0007 §4); it migrates the schema itself.
      SV_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@studio-db:5432/simvehicleapp
      SV_COMPILER_URL: http://compiler:4020
      SV_WORKSPACE_URL: http://workspace:4040
      SV_BACKENDS: ${SV_BACKENDS:-cpp=http://codegen-cpp:4110}
      SV_TOOLCHAINS: ${SV_TOOLCHAINS:-cpp=http://toolchain-cpp:4210}
      # Runs (M8): databroker per VSS release (ADR-0024 §6) and the gateway that mirrors actuators.
      SV_DATABROKERS: ${SV_DATABROKERS:-v4.0=databroker:55555,v4.2=databroker-v4-2:55555}
      SV_SIGNAL_GATEWAY_URL: http://signal-gateway:4050
      # code-server as the browser reaches it (Appendix A `editor.url`).
      SV_IDE_URL: ${SV_IDE_PUBLIC_URL:-http://127.0.0.1:${SV_IDE_PORT:-8080}}
      # Licensed features (ADR-0031): `full` (MVP) allows all and logs decisions; `enforce` applies SV_LICENSE_KEY.
      SV_LICENSE_MODE: ${SV_LICENSE_MODE:-full}
      SV_LICENSE_KEY: ${SV_LICENSE_KEY:-}
      SV_LICENSE_PUBLIC_KEY: ${SV_LICENSE_PUBLIC_KEY:-}
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-info}
      # Host capacity governance (ADR-0053, docs/DEPLOY.md): app quota, workflows per app, SynCode queue, sweeper.
      SV_MAX_APPS_TOTAL: ${SV_MAX_APPS_TOTAL:-100}
      SV_MAX_WORKFLOWS_PER_APP: ${SV_MAX_WORKFLOWS_PER_APP:-20}
      SV_MAX_QUEUED_GENERATIONS: ${SV_MAX_QUEUED_GENERATIONS:-20}
      SV_IDLE_CLEAN_DAYS: ${SV_IDLE_CLEAN_DAYS:-14}
      SV_FAILED_TTL_DAYS: ${SV_FAILED_TTL_DAYS:-7}
      SV_SWEEP_INTERVAL_MIN: ${SV_SWEEP_INTERVAL_MIN:-60}
      # Runs (ADR-0057): SV_RUN_SANDBOX=1 gives every run a databroker of its own (several users and apps at once),
      # within quotas and a time limit; 0 = one run at a time on the shared databrokers.
      SV_RUN_SANDBOX: ${SV_RUN_SANDBOX:-0}
      SV_MAX_RUNS_PER_USER: ${SV_MAX_RUNS_PER_USER:-2}
      SV_MAX_RUNS_TOTAL: ${SV_MAX_RUNS_TOTAL:-20}
      SV_RUN_MAX_MINUTES: ${SV_RUN_MAX_MINUTES:-30}
      SV_RUN_MAX_EXTENSIONS: ${SV_RUN_MAX_EXTENSIONS:-3}
      # Databroker API of each backend's apps (ADR-0047): unset = kuksa.val.v2 for all; *=sdv.databroker.v1 or
      # cpp=sdv.databroker.v1 to go back.
      SV_DATABROKER_API: ${SV_DATABROKER_API:-}
    # Internal only: the studio BFF reaches it as http://orchestrator:4030.
    # Hardening (analysis/14 §5): no Linux capabilities, no privilege escalation.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sv-internal, sv-codegen]
    restart: unless-stopped

  workspace:
    image: simvehicleapp/workspace:dev
    build:
      context: .
      dockerfile: services/workspace/Dockerfile
      additional_contexts:
        contracts: docker-image://${SV_CONTRACTS_IMAGE:-simvehicleapp/contracts:dev}
    environment:
      SV_COMMIT: ${SV_COMMIT:-unknown}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env}
      SV_TOOLCHAINS: ${SV_TOOLCHAINS:-cpp=http://toolchain-cpp:4210}
      SV_BACKENDS: ${SV_BACKENDS:-cpp=http://codegen-cpp:4110}
      SV_CATALOG_URL: http://vss-catalog:4010
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-info}
      # Host capacity (ADR-0053): free-disk thresholds of the projects volume and generations kept per app.
      SV_DISK_LOW_GB: ${SV_DISK_LOW_GB:-10}
      SV_DISK_HIGH_GB: ${SV_DISK_HIGH_GB:-5}
      SV_DISK_FLOOD_GB: ${SV_DISK_FLOOD_GB:-2}
      SV_KEEP_GENERATIONS: ${SV_KEEP_GENERATIONS:-10}
      # Fault injection for the M7 gate only (gate/m7-gate.sh): empty in every real deployment.
      SV_FAULT_AT: ${SV_FAULT_AT:-}
    # The only writer of /workspace/projects (ADR-0026); same volume as the toolchain and IDE.
    volumes:
      - sv-workspace:/workspace
    # Internal only: reached as http://workspace:4040; reaches backends on sv-codegen.
    # Hardening (analysis/14 §5): no Linux capabilities, no privilege escalation.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sv-internal, sv-codegen]
    restart: unless-stopped

  signal-gateway:
    image: simvehicleapp/signal-gateway:dev
    build:
      context: .
      dockerfile: services/signal-gateway/Dockerfile
      additional_contexts:
        contracts: docker-image://${SV_CONTRACTS_IMAGE:-simvehicleapp/contracts:dev}
    environment:
      SV_COMMIT: ${SV_COMMIT:-unknown}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env}
      # One databroker per VSS release (ADR-0024 §6); the same map the orchestrator uses for runs.
      SV_DATABROKERS: ${SV_DATABROKERS:-v4.0=databroker:55555,v4.2=databroker-v4-2:55555}
      SV_CATALOG_URL: http://vss-catalog:4010
      SDV_MQTT_ADDRESS: mqtt://mqtt:1883
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-info}
    # Internal only: the studio BFF reaches it as http://signal-gateway:4050.
    # Hardening (analysis/14 §5): no Linux capabilities, no privilege escalation.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sv-internal]
    restart: unless-stopped

  vehicle-gateway:
    image: simvehicleapp/vehicle-gateway:dev
    build:
      context: .
      dockerfile: services/vehicle-gateway/Dockerfile
      additional_contexts:
        contracts: docker-image://${SV_CONTRACTS_IMAGE:-simvehicleapp/contracts:dev}
    environment:
      SV_COMMIT: ${SV_COMMIT:-unknown}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env}
      # One port per deployment (ADR-0060): the deployed app's databroker address is vehicle-gateway:<port>.
      SV_VEHICLE_GATEWAY_PORTS: ${SV_VEHICLE_GATEWAY_PORTS:-57000-57099}
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-info}
    # Internal only (control API :4060, routes 57000-57099 on sv-internal); it reaches deploy targets outside.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sv-internal]
    restart: unless-stopped

volumes:
  sv-workspace:

networks:
  sv-internal:
  sv-codegen:
    internal: true
