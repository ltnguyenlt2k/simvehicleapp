# velocitas-stack — self-contained compose fragment.
#   standalone:  docker compose -f modules/velocitas-stack/compose.yaml up -d
#   in system :  included by the root docker-compose.yml
# Paths are relative to THIS file (compose `include` semantics).
services:
  # The template's own devcontainer image, built exactly like VS Code Dev Containers does.
  devcontainer-cpp:
    image: simvehicleapp/devcontainer-cpp:dev
    build:
      context: ./templates/vehicle-app-cpp-template/.devcontainer
    command: ["true"]            # build-stage service: exits immediately, exists so toolchain-cpp can FROM it
    restart: "no"

  toolchain-cpp:
    image: simvehicleapp/toolchain-cpp:dev
    build:
      context: .
      dockerfile: toolchain/cpp/Dockerfile
      additional_contexts:
        devcontainer: service:devcontainer-cpp
        contracts: docker-image://${SV_CONTRACTS_IMAGE:-simvehicleapp/contracts:dev}
      args:
        CONAN_JOBS: ${SV_CONAN_JOBS:-8}
    environment:
      SV_COMMIT: ${SV_COMMIT:-unknown}
      # Toolchain agent on :4210 (internal only): jobs for the orchestrator (ADR-0025).
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env}
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-info}
      SDV_MIDDLEWARE_TYPE: native
      SDV_VEHICLEDATABROKER_ADDRESS: grpc://databroker:55555
      SDV_MQTT_ADDRESS: mqtt://mqtt:1883
      VELOCITAS_OFFLINE: "1"
    volumes:
      - sv-workspace:/workspace
      - sv-ccache:/home/vscode/.ccache
      # Shared with toolchain/IDE (same image, same uid 4000) so a model generated or a package
      # exported in one container is visible in the other. Docker seeds new volumes from the image.
      # After rebuilding the toolchain image:  docker compose down && docker volume rm simvehicleapp_sv-conan2 simvehicleapp_sv-velocitas
      - sv-conan2:/home/vscode/.conan2
      - sv-velocitas:/home/vscode/.velocitas
    networks: [sv-internal, sv-edge]
    depends_on: [databroker, mqtt]

  # Python (ADR-0040, M12): opt-in with the `python` profile (COMPOSE_PROFILES=python in .env, plus
  # python=… in SV_BACKENDS/SV_TOOLCHAINS — see .env.example).
  devcontainer-python:
    image: simvehicleapp/devcontainer-python:dev
    profiles: ["python"]
    build:
      context: ./templates/vehicle-app-python-template/.devcontainer
    command: ["true"]            # build-stage service, like devcontainer-cpp
    restart: "no"

  toolchain-python:
    image: simvehicleapp/toolchain-python:dev
    profiles: ["python"]
    build:
      context: .
      dockerfile: toolchain/python/Dockerfile
      additional_contexts:
        devcontainer: service:devcontainer-python
        contracts: docker-image://${SV_CONTRACTS_IMAGE:-simvehicleapp/contracts:dev}
    environment:
      SV_COMMIT: ${SV_COMMIT:-unknown}
      # Toolchain agent on :4220 (internal only): jobs for the orchestrator (ADR-0025, ADR-0040 §4).
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env}
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-info}
      SDV_MIDDLEWARE_TYPE: native
      SDV_VEHICLEDATABROKER_ADDRESS: grpc://databroker:55555
      SDV_MQTT_ADDRESS: mqtt://mqtt:1883
      VELOCITAS_OFFLINE: "1"
    volumes:
      - sv-workspace:/workspace
      # Velocitas packages and per-project component venvs, shared with ide-python (same image, uid 4000).
      - sv-velocitas-python:/home/vscode/.velocitas
    networks: [sv-internal, sv-edge]
    depends_on: [databroker, mqtt]

  # Rust (ADR-0041, feasibility — experimental, not Velocitas tooling): opt-in with the `rust` profile and
  # rust=… in SV_BACKENDS/SV_TOOLCHAINS. Needs image simvehicleapp/codegen-rust:dev (its runtime crate is the seed's).
  toolchain-rust:
    image: simvehicleapp/toolchain-rust:dev
    profiles: ["rust"]
    build:
      context: .
      dockerfile: toolchain/rust/Dockerfile
      additional_contexts:
        codegen: docker-image://${SV_CODEGEN_RUST_IMAGE:-simvehicleapp/codegen-rust:dev}
        contracts: docker-image://${SV_CONTRACTS_IMAGE:-simvehicleapp/contracts:dev}
      args:
        CARGO_JOBS: ${SV_CARGO_JOBS:-2}
    environment:
      SV_COMMIT: ${SV_COMMIT:-unknown}
      # Toolchain agent on :4230 (internal only).
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set in .env}
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-info}
      SV_CARGO_JOBS: ${SV_CARGO_JOBS:-2}
      SDV_VEHICLEDATABROKER_ADDRESS: grpc://databroker:55555
      SDV_MQTT_ADDRESS: mqtt://mqtt:1883
    volumes:
      - sv-workspace:/workspace
      # Warm dependency builds shared by every Rust project (seeded from the image).
      - sv-rust-target:/home/vscode/.sv-target
    networks: [sv-internal, sv-edge]
    depends_on: [databroker, mqtt]

  databroker:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:0.5.0
    # VSS 4.0 metadata: the image default is identical, we mount our pinned copy explicitly.
    command: ["--insecure", "--enable-databroker-v1", "--vss", "/vss/vss_rel_4.0.json"]
    volumes:
      - ./vss:/vss:ro
    ports: ["127.0.0.1:${SV_DATABROKER_PORT:-55555}:55555"]
    networks: [sv-internal]

  # One databroker per supported VSS release (ADR-0024 §6): runs of a v4.2 project use this one
  # (SV_DATABROKERS). Internal only; a databroker idles at a few MB, so it runs by default.
  databroker-v4-2:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:0.5.0
    command: ["--insecure", "--enable-databroker-v1", "--vss", "/vss/vss_rel_4.2.json"]
    volumes:
      - ./vss:/vss:ro
    networks: [sv-internal]

  mqtt:
    image: eclipse-mosquitto:2.0.14
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./runtime/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:${SV_MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${SV_MQTT_WS_PORT:-9001}:9001"
    networks: [sv-internal]

  mock-provider:
    image: ghcr.io/eclipse-kuksa/kuksa-mock-provider/mock-provider:0.4.1
    profiles: ["mock"]
    environment:
      VDB_ADDRESS: databroker:55555
    volumes:
      - ./runtime/mock/mock.py:/mock/mock.py:ro
    networks: [sv-internal]
    depends_on: [databroker]

volumes:
  sv-workspace:
  sv-ccache:
  sv-conan2:
  sv-velocitas:
  sv-velocitas-python:
  sv-rust-target:

networks:
  sv-internal:
  sv-edge:
