# SimVehicleApp — root compose (dev phase). Each module owns its compose fragment; this file only aggregates.
#   docker compose up -d                      # runtime stack + toolchain (+ ide)
#   docker compose --profile mock up -d       # + kuksa mock-provider
# Build order: devcontainer-cpp → toolchain-cpp → ide-cpp, and contracts → core services; `scripts/sv build` handles it.
name: simvehicleapp
include:
  - modules/simvehicleapp-contracts/compose.yaml
  - modules/simvehicleapp-core/compose.yaml
  - modules/compiler-code-cpp/compose.yaml
  - modules/simvehicleapp-orchestrator/compose.yaml
  - modules/velocitas-stack/compose.yaml
  - modules/ide-vscode/compose.yaml
  - modules/simvehicleapp-ai/compose.yaml
  - modules/simvehicleapp-studio/compose.simvehicleapp.yaml
