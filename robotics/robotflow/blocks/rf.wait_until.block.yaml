{
  "schema": "block.v1",
  "id": "rf.wait_until",
  "version": 1,
  "category": "flow",
  "title": {
    "vi": "Chờ điều kiện",
    "en": "Wait until"
  },
  "ports": {
    "inputs": {
      "in": {
        "role": "in",
        "required": true,
        "fanIn": false
      }
    },
    "outputs": {
      "succeeded": {
        "role": "result",
        "required": true
      },
      "timed_out": {
        "role": "result",
        "required": true
      }
    }
  },
  "props": {
    "when": {
      "type": "expression",
      "required": true,
      "default": "abs(Robot.Velocity.Linear.X) < 0.05 m/s"
    },
    "timeoutMs": {
      "type": "duration",
      "required": true,
      "default": 3000,
      "unit": "ms",
      "minimum": 1,
      "maximum": 86400000
    }
  },
  "semantics": {
    "vi": "Chờ điều kiện đúng với dữ liệu mới hoặc đi nhánh hết thời gian; dữ liệu cũ không thỏa điều kiện.",
    "en": "Fresh true condition or finite monotonic timeout; NONE/STALE cannot satisfy it."
  },
  "lowering": "wait_until",
  "migrations": []
}
