{
  "schema": "block.v1",
  "id": "rf.arm",
  "version": 1,
  "category": "robot",
  "title": {
    "vi": "Cho phép chuyển động",
    "en": "Arm"
  },
  "ports": {
    "inputs": {
      "in": {
        "role": "in",
        "required": true,
        "fanIn": false
      }
    },
    "outputs": {
      "succeeded": {
        "role": "result",
        "required": true
      },
      "failed": {
        "role": "result",
        "required": true
      },
      "rejected": {
        "role": "result",
        "required": true
      },
      "cancelled": {
        "role": "result",
        "required": true
      },
      "timed_out": {
        "role": "result",
        "required": true
      }
    }
  },
  "props": {
    "timeoutMs": {
      "type": "duration",
      "required": true,
      "default": 3000,
      "unit": "ms",
      "minimum": 1,
      "maximum": 3000,
      "title": {
        "vi": "Thời hạn (ms)",
        "en": "Timeout (ms)"
      }
    }
  },
  "semantics": {
    "vi": "Cần quyền mô phỏng rõ ràng và phản hồi MANUAL thật; mất quyền không tự xin lại.",
    "en": "Explicit SIM Arm needs approved profile/fresh run authority and actual MANUAL feedback; never automatically reclaims after loss."
  },
  "lowering": "arm",
  "migrations": []
}
