{
  "schema": "block.v1",
  "id": "rf.patrol",
  "version": 1,
  "category": "robot",
  "title": {
    "vi": "Tuần tra",
    "en": "Patrol"
  },
  "ports": {
    "inputs": {
      "in": {
        "role": "in",
        "required": true,
        "fanIn": false
      }
    },
    "outputs": {
      "succeeded": {
        "role": "result",
        "required": true
      },
      "failed": {
        "role": "result",
        "required": true
      },
      "rejected": {
        "role": "result",
        "required": true
      },
      "cancelled": {
        "role": "result",
        "required": true
      },
      "timed_out": {
        "role": "result",
        "required": true
      }
    }
  },
  "props": {
    "waypoints": {
      "type": "waypoints",
      "required": true,
      "default": [
        [
          0.8,
          0.0
        ],
        [
          -0.8,
          0.0
        ]
      ]
    },
    "count": {
      "type": "integer",
      "required": true,
      "default": 2,
      "minimum": 1,
      "maximum": 10
    },
    "timeoutMs": {
      "type": "duration",
      "required": true,
      "default": 60000,
      "unit": "ms",
      "minimum": 1,
      "maximum": 60000
    }
  },
  "semantics": {
    "vi": "Đi qua các điểm theo số vòng giới hạn, mỗi điểm có thời hạn; lỗi hủy các điểm còn lại và đi đúng nhánh kết quả.",
    "en": "Expand bounded waypoints/repetitions into sequential GoTo with per-point timeout. Non-success aborts all remaining points and takes its result branch once; no auto resume."
  },
  "lowering": "patrol",
  "migrations": []
}
