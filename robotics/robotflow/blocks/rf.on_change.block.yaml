{
  "schema": "block.v1",
  "id": "rf.on_change",
  "version": 1,
  "category": "trigger",
  "title": {
    "vi": "Khi tín hiệu đổi",
    "en": "On change"
  },
  "ports": {
    "inputs": {},
    "outputs": {
      "next": {
        "role": "next",
        "required": true
      }
    }
  },
  "props": {
    "concurrency": {
      "type": "enum",
      "required": true,
      "default": "drop",
      "values": [
        "queue",
        "drop",
        "restart"
      ]
    },
    "queueMax": {
      "type": "integer",
      "required": true,
      "default": 1,
      "minimum": 1,
      "maximum": 16
    },
    "path": {
      "type": "rss-path",
      "required": true,
      "default": "Robot.Perception.Marker.Count",
      "kind": "sensor"
    }
  },
  "semantics": {
    "vi": "Chỉ kích hoạt khi giá trị mới còn hợp lệ thay đổi; dữ liệu cũ hoặc thiếu không gây chuyển động.",
    "en": "Fires on fresh typed value changes, not capture timestamp changes. NONE/STALE never starts body control."
  },
  "lowering": "on_change",
  "migrations": []
}
