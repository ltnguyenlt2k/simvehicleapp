{
  "schema": "block.v1",
  "id": "rf.on_change",
  "version": 1,
  "category": "trigger",
  "title": {
    "vi": "Khi tín hiệu đổi",
    "en": "On change"
  },
  "ports": {
    "inputs": {},
    "outputs": {
      "next": {
        "role": "next",
        "required": true
      }
    }
  },
  "props": {
    "concurrency": {
      "type": "enum",
      "required": true,
      "default": "drop",
      "values": [
        "queue",
        "drop",
        "restart"
      ],
      "title": {
        "vi": "Khi kích hoạt lại",
        "en": "On repeated activation"
      },
      "labels": {
        "queue": {
          "vi": "Xếp hàng",
          "en": "Queue"
        },
        "drop": {
          "vi": "Bỏ qua lượt mới",
          "en": "Ignore new activation"
        },
        "restart": {
          "vi": "Khởi động lại nhánh",
          "en": "Restart behavior"
        }
      }
    },
    "queueMax": {
      "type": "integer",
      "required": true,
      "default": 1,
      "minimum": 1,
      "maximum": 16,
      "title": {
        "vi": "Số lượt chờ tối đa",
        "en": "Maximum queued activations"
      }
    },
    "path": {
      "type": "rss-path",
      "required": true,
      "default": "Robot.Perception.Marker.Count",
      "kind": "sensor",
      "title": {
        "vi": "Tín hiệu",
        "en": "Signal"
      }
    }
  },
  "semantics": {
    "vi": "Chỉ kích hoạt khi giá trị mới còn hợp lệ thay đổi; dữ liệu cũ hoặc thiếu không gây chuyển động.",
    "en": "Fires on fresh typed value changes, not capture timestamp changes. NONE/STALE never starts body control."
  },
  "lowering": "on_change",
  "migrations": []
}
