{
  "schema": "block.v1",
  "id": "rf.on_condition",
  "version": 1,
  "category": "trigger",
  "title": {
    "vi": "Khi điều kiện đúng",
    "en": "On condition"
  },
  "ports": {
    "inputs": {},
    "outputs": {
      "next": {
        "role": "next",
        "required": true
      }
    }
  },
  "props": {
    "concurrency": {
      "type": "enum",
      "required": true,
      "default": "drop",
      "values": [
        "queue",
        "drop",
        "restart"
      ]
    },
    "queueMax": {
      "type": "integer",
      "required": true,
      "default": 1,
      "minimum": 1,
      "maximum": 16
    },
    "when": {
      "type": "expression",
      "required": true,
      "default": "Robot.PowerSystem.Battery.StateOfCharge < 20 %"
    },
    "forMs": {
      "type": "duration",
      "required": true,
      "default": 0,
      "unit": "ms",
      "minimum": 0,
      "maximum": 86400000
    }
  },
  "semantics": {
    "vi": "Điều kiện phải đúng liên tục với dữ liệu mới trong thời gian chờ; mất chất lượng làm tính lại thời gian.",
    "en": "Requires continuously fresh true condition for monotonic debounce. Re-arms only after fresh false; quality loss resets debounce."
  },
  "lowering": "on_condition",
  "migrations": []
}
