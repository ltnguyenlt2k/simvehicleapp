{
  "schema": "block.v1",
  "id": "rf.perform",
  "version": 1,
  "category": "robot",
  "title": {
    "vi": "Thực hiện động tác",
    "en": "Perform motion"
  },
  "ports": {
    "inputs": {
      "in": {
        "role": "in",
        "required": true,
        "fanIn": false
      }
    },
    "outputs": {
      "succeeded": {
        "role": "result",
        "required": true
      },
      "failed": {
        "role": "result",
        "required": true
      },
      "rejected": {
        "role": "result",
        "required": true
      },
      "cancelled": {
        "role": "result",
        "required": true
      },
      "timed_out": {
        "role": "result",
        "required": true
      }
    }
  },
  "props": {
    "name": {
      "type": "enum",
      "required": true,
      "default": "BOW",
      "values": [
        "CROUCH",
        "BOW",
        "TILT",
        "LIFT_FRONT_LEFT",
        "JUMP"
      ],
      "title": {
        "vi": "Tên",
        "en": "Name"
      },
      "labels": {
        "CROUCH": {
          "vi": "Hạ thân",
          "en": "Crouch"
        },
        "BOW": {
          "vi": "Cúi chào",
          "en": "Bow"
        },
        "TILT": {
          "vi": "Nghiêng thân",
          "en": "Tilt"
        },
        "LIFT_FRONT_LEFT": {
          "vi": "Nhấc chân trước trái",
          "en": "Lift front-left foot"
        },
        "JUMP": {
          "vi": "Nhảy",
          "en": "Jump"
        }
      }
    },
    "timeoutMs": {
      "type": "duration",
      "required": true,
      "default": 15000,
      "unit": "ms",
      "minimum": 1,
      "maximum": 15000,
      "title": {
        "vi": "Thời hạn (ms)",
        "en": "Timeout (ms)"
      }
    }
  },
  "semantics": {
    "vi": "Thực hiện một động tác đã kiểm chứng; chờ đúng kết quả vật lý và trả quyền chuyển động, không coi ACK là thành công.",
    "en": "One qualified named motion; await matching physical terminal and body release. Physics rejection after ACK is failed, never succeeded."
  },
  "lowering": "perform",
  "migrations": []
}
