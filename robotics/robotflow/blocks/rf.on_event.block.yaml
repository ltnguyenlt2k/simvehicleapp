      "required": true,
      "default": "jump"
    }
  },
  "semantics": {
    "vi": "Nhận sự kiện có tên được gửi rõ ràng từ bộ chạy; không thực thi mã hoặc địa chỉ tùy ý.",
    "en": "Consumes explicit named runner event; no arbitrary code or callback URL."
