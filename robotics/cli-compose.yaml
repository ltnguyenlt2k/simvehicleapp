x-native: &native
  image: sr-rfrt:dev
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 2
  pids_limit: 64
  stdin_open: true
  profiles: [native-tools]
services:
  native-sim:
    <<: *native
    networks: [sim-bus]
    volumes: ["./runtime/apps:/apps:ro", "./runtime/targets:/targets:ro"]
  native-live:
    <<: *native
    networks: [live-bus]
    volumes: ["./runtime/apps:/apps:ro", "./runtime/targets:/targets:ro"]
