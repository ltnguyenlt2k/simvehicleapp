name: sr-live-test
services:
  broker:
    image: sr-protobus:dev
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp, "/data:uid=10001,gid=10001,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    command: [python, -m, broker, --catalog, /contracts/fixtures/rss-go2-catalog.v1.json]
    networks: [bus]
  ros:
    image: sr-protobus-ros2:dev
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 2
    environment:
      ROS_DOMAIN_ID: 52
      CYCLONEDDS_URI: file:///opt/protobus/profiles/dog-go2-sim/cyclonedds.xml
    command: [python3, -m, ros_bridge, --catalog, /contracts/fixtures/rss-go2-catalog.v1.json, --bus, "broker:55600", --authorize-sim-arm]
    networks:
      dog: {interface_name: eth0}
      bus: {interface_name: eth1}
networks:
  bus: {internal: true}
  dog: {external: true, name: dog-ros2-r1_robot}
