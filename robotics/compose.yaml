# Robotics stack (compose project "sr"), independent from the vehicle compose (ADR-0064).
# Every service: read-only root, no capabilities, memory/CPU/pids limits (ADR-0070). Ports bind 127.0.0.1 only.
name: sr
x-limits: &limits
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: 64
  restart: unless-stopped
services:
  protobus-broker:
    <<: *limits
    image: robotics/protobus:local
    command: [python, -m, protobus.broker.main]
    environment: { PB_AUDIT_DIR: /audit }
    volumes: ["pb-audit:/audit"]
    networks: [bus]
    mem_limit: 192m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -m, protobus.pbctl, --broker, "127.0.0.1:55500", health]
      interval: 5s
      timeout: 3s
      retries: 10
  protobus-mock:
    <<: *limits
    image: robotics/protobus:local
    command: [python, -m, protobus.mock.provider, --broker, "protobus-broker:55500", --safety, "protobus-broker:55501"]
    networks: [bus]
    mem_limit: 128m
    cpus: 0.5
    depends_on: { protobus-broker: { condition: service_healthy } }
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request;assert json.load(urllib.request.urlopen('http://127.0.0.1:8070/health',timeout=2))['ready']"]
      interval: 5s
      timeout: 3s
      retries: 10
  robotics-control:
    <<: *limits
    image: robotics/control:local
    environment:
      RC_INTERNAL_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in the root .env (scripts/sv init)}
      RC_ZOO_URL: ${SR_ZOO_URL:-http://127.0.0.1:8090}
    volumes: ["rc-data:/data"]
    networks: [bus, bus-ros, gui]
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4600/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  # ---- ros mode: an independent broker + the ROS 2 bridge, joined to the dog robot's DDS network (profile "ros")
  protobus-broker-ros:
    <<: *limits
    profiles: [ros]
    image: robotics/protobus:local
    command: [python, -m, protobus.broker.main]
    environment: { PB_AUDIT_DIR: /audit }
    volumes: ["pb-audit-ros:/audit"]
    networks: [bus-ros]
    mem_limit: 192m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -m, protobus.pbctl, --broker, "127.0.0.1:55500", health]
      interval: 5s
      timeout: 3s
      retries: 10
  protobus-ros2:
    <<: *limits
    profiles: [ros]
    image: robotics/protobus-ros2:local
    hostname: protobus-ros2
    environment:
      ROS_DOMAIN_ID: ${SR_DOG_ROS_DOMAIN_ID:-42}
      PB_BROKER: protobus-broker-ros:55500
      PB_SAFETY: protobus-broker-ros:55501
      ROS_LOG_DIR: /tmp/roslog
      HOME: /tmp
    networks:  # DDS is pinned to eth0 (cyclonedds.xml), so the dog network must be eth0
      dog: { interface_name: eth0 }
      bus-ros: { interface_name: eth1 }
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    depends_on: { protobus-broker-ros: { condition: service_healthy } }
  pbctl-ros:
    <<: *limits
    profiles: [tools]
    restart: "no"
    image: robotics/protobus:local
    entrypoint: [python, -m, protobus.pbctl, --broker, "protobus-broker-ros:55500", --safety, "protobus-broker-ros:55501"]
    networks: [bus-ros]
    mem_limit: 96m
    cpus: 0.5
  pbctl:
    <<: *limits
    profiles: [tools]
    restart: "no"
    image: robotics/protobus:local
    entrypoint: [python, -m, protobus.pbctl, --broker, "protobus-broker:55500", --safety, "protobus-broker:55501"]
    networks: [bus]
    mem_limit: 96m
    cpus: 0.5
  dev:
    <<: *limits
    profiles: [tools]
    restart: "no"
    image: robotics/python-dev:local
    network_mode: none
    mem_limit: 512m
    cpus: 2
    volumes: [".:/w"]
    command: [python, -m, pytest, -q, -p, no:cacheprovider]
volumes:
  pb-audit: { name: sr-pb-audit-v1 }
  pb-audit-ros: { name: sr-pb-audit-ros-v1 }
  rc-data: { name: sr-rc-data-v1 }
networks:
  bus: { name: sr-bus-v1, internal: true }
  bus-ros: { name: sr-bus-ros-v1, internal: true }
  gui: { name: sr-gui-v1, internal: true }  # studio BFF ↔ robotics-control only
  dog: { name: "${SR_DOG_NETWORK:-dog-ros2_robot}", external: true }
